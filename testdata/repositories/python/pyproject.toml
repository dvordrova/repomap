[project]
name = "repomap-cumulative-python-fixture"
version = "0.0.0"
dependencies = [
  "fastapi",
  "httpx",
  "kafka-python",
	"pytest",
  "uvicorn",
]

[project.scripts]
repomap-fixture = "fixture_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fixture_app*", "acme", "acme.*"]
exclude = ["acme.excluded", "acme.excluded.*"]
namespaces = false

[tool.pytest]
python_files = ["test_*.py"]
