<script>
(async function(){
  var output=document.getElementById('result');
  function check(value,message){if(!value)throw new Error(message);}
  function ids(element){return element.querySelector('.term-mention')?.dataset.termIds||'';}
  function tick(){return new Promise(function(resolve){setTimeout(resolve,0);});}
  try{
    var first=document.getElementById('first'),second=document.getElementById('second'),map=document.getElementById('map');
    check(first.closest('.model').querySelector('.source-hint'),'source preview did not initialize');
    check(ids(first)==='finance'&&ids(second)==='river','identical text lost its distinct definitions');
    check(!ids(document.getElementById('unconfirmed'))&&!ids(document.getElementById('unbound')),'equal text acquired an unconfirmed definition');
    var item=repomapMembers.items(document.getElementById('member-node'))[0];
    check(item.explanation==='Same word.'&&item.explanation_ref==='t1','declaration inventory lost its prose ref or included citations');
    var clone=first.cloneNode(true);clone.id='cloned';clone.dataset.displayRef='t2';map.appendChild(clone);
    await tick();
    check(ids(clone)==='river','clone reused the old text definition');
    clone.querySelector('.term-mention').click();
    check(document.querySelector('.term-popup-definition h3')?.textContent==='River definition','cloned annotation did not bind its own preview');
    first.textContent=item.explanation;first.dataset.displayRef='t2';
    await tick();
    check(ids(first)==='river','dynamic selection kept the prior ref for equal text');
    first.textContent=item.explanation;first.dataset.displayRef='t3';
    await tick();
    check(!ids(first),'dynamic unconfirmed selection borrowed an equal-text definition');
    clone.textContent='Changed word.';clone.dataset.displayRef='t2';
    await tick();
    check(!ids(clone),'offsets were applied after the slot text changed');
    output.textContent='PASS';
  }catch(error){output.textContent='FAIL: '+error.message;}
})();
</script>
