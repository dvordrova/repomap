<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>repomap — testrepo — test project</title>
  <style>:root { --rm-bg: #fff; --rm-fg: #1a1a1a; --rm-card: #f5f5f5; --rm-border: #e0e0e0; --rm-accent: #2563eb; --rm-dim: #666; --rm-code: #d63384; --rm-good: #16a34a; --rm-warn: #ca8a04; --rm-bad: #dc2626; --rm-info: #0ea5e9; --rm-muted: #9ca3af; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; background: var(--rm-bg); color: var(--rm-fg); line-height: 1.5; font-size: 14px; overflow-x: hidden; }
header { background: linear-gradient(135deg, #1e293b, #334155); color: #fff; padding: .8rem 1.5rem; }
.rm-header-inner { max-width: 1240px; margin: 0 auto; display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
header h1 { margin: 0; font-size: 1.3rem; }
header p { margin: 0; opacity: .8; font-size: .9rem; }
.rm-header-actions { align-items: flex-end; display: flex; flex-direction: column; gap: .4rem; max-width: 65%; }
.rm-run-details { max-width: 65%; text-align: right; font-size: .78rem; color: rgba(255,255,255,.75); }
.rm-run-details summary { cursor: pointer; user-select: none; }
.rm-artifacts { font-size: .7rem; opacity: .7; margin-top: .35rem; font-family: monospace; overflow-wrap: anywhere; }
.rm-run-picker { align-items: center; display: flex; gap: .45rem; font-size: .72rem; color: rgba(255,255,255,.75); }
.rm-run-picker[hidden], .rm-run-details[hidden], .rm-source-drawer[hidden] { display: none !important; }
.rm-run-picker select { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.3); border-radius: 5px; color: #fff; font: inherit; max-width: 26rem; padding: .2rem .35rem; }
.rm-run-picker option { color: #111; }
.rm-editor-hint { color: rgba(255,255,255,.72); font-size: .7rem; }
.rm-container { max-width: 1240px; margin: 0 auto; padding: 1.5rem; }

/* User Report v2 workspace. */
.rm-workspace { display: grid; grid-template-columns: 220px minmax(0, 1fr); margin: 0 auto; max-width: 1680px; min-height: calc(100vh - 65px); }
.rm-workspace.has-source-drawer { grid-template-columns: 220px minmax(0, 1fr) clamp(400px, 38vw, 520px); }
.rm-repository-nav { border-right: 1px solid var(--rm-border); padding: 1.5rem 1rem; }
.rm-repository-nav__eyebrow { color: var(--rm-muted); font-size: .68rem; font-weight: 700; letter-spacing: .08em; margin: 0 .65rem .75rem; text-transform: uppercase; }
.rm-repository-nav .rm-tabs { align-items: stretch; border: 0; display: flex; flex-direction: column; gap: .25rem; margin: 0; position: sticky; top: 1.5rem; }
.rm-repository-nav .rm-tab { border: 0; border-radius: 7px; color: var(--rm-dim); margin: 0; padding: .65rem .75rem; text-align: left; }
.rm-repository-nav .rm-tab:hover { background: var(--rm-card); color: var(--rm-fg); }
.rm-repository-nav .rm-tab.rm-active { background: #eff6ff; color: var(--rm-accent); }
.rm-main-content { min-width: 0; padding: 2rem clamp(1.25rem, 3vw, 3rem); }
.rm-main-content > .rm-tab-content { margin: 0 auto; max-width: 1080px; }
.rm-view-heading { margin-bottom: 1.5rem; }
.rm-view-kicker { color: var(--rm-accent); font-size: .7rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
.rm-view-heading h2 { font-size: clamp(1.45rem, 2.4vw, 2rem); line-height: 1.2; margin: .3rem 0 .55rem; }
.rm-view-heading p { color: var(--rm-dim); font-size: .9rem; margin: 0; max-width: 48rem; }
.rm-workspace-section { margin-top: 2.25rem; }
.rm-overview-hero { background: linear-gradient(145deg, #f8fbff, #f5f3ff); border: 1px solid #cbd5e1; border-radius: 12px; padding: clamp(1.25rem, 3vw, 2rem); }
.rm-overview-hero h2 { font-size: clamp(1.6rem, 3vw, 2.35rem); line-height: 1.15; margin: .35rem 0 .8rem; }
.rm-overview-hero p { color: #475569; font-size: .95rem; max-width: 54rem; }
.rm-brief-lead { color: #1e293b !important; font-size: 1.05rem !important; line-height: 1.65; }
.rm-brief-facts { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin-top: 1.25rem; }
.rm-brief-fact { background: rgba(255,255,255,.78); border: 1px solid #dbeafe; border-radius: 8px; display: grid; gap: .3rem; padding: .75rem; }
.rm-brief-fact span { color: #64748b; font-size: .62rem; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
.rm-brief-fact strong { color: #1e293b; font-size: .78rem; line-height: 1.45; }
.rm-brief-terms { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: 1rem; }
.rm-brief-term { background: #fff; border: 1px solid #e2e8f0; border-radius: 999px; display: flex; gap: .35rem; padding: .35rem .55rem; }
.rm-brief-term strong, .rm-brief-term span { font-size: .66rem; }
.rm-brief-term span { color: #64748b; }
.rm-study-direction-list { display: grid; gap: .7rem; }
.rm-study-direction-card { align-items: flex-start; background: #fff; border: 1px solid var(--rm-border); border-radius: 11px; color: var(--rm-fg); cursor: pointer; display: grid; font: inherit; gap: .9rem; grid-template-columns: 2rem minmax(0, 1fr); padding: 1rem; text-align: left; width: 100%; }
.rm-study-direction-card:hover, .rm-study-direction-card:focus-visible { border-color: var(--rm-accent); box-shadow: 0 8px 22px rgba(15,23,42,.08); outline: none; }
.rm-study-direction-card__order, .rm-study-reading-anchor__order { align-items: center; background: #eff6ff; border-radius: 999px; color: #1d4ed8; display: inline-flex; flex: 0 0 auto; font-size: .72rem; font-weight: 800; height: 2rem; justify-content: center; width: 2rem; }
.rm-study-direction-card__body { display: grid; gap: .42rem; min-width: 0; }
.rm-study-direction-card__body > strong { font-size: .96rem; line-height: 1.35; }
.rm-study-direction-card__reason { color: #334155; font-size: .78rem; line-height: 1.5; }
.rm-study-direction-card__outcome { color: #64748b; font-size: .72rem; line-height: 1.45; }
.rm-study-direction-card__anchors { display: flex; flex-wrap: wrap; gap: .35rem; }
.rm-study-direction-card__anchors code { background: #f8fafc; border-radius: 4px; color: #475569; font-size: .62rem; max-width: 100%; overflow-wrap: anywhere; padding: .18rem .32rem; }
.rm-study-direction-card__action { color: var(--rm-accent); font-size: .74rem; font-weight: 750; margin-top: .2rem; }
.rm-study-back { margin-bottom: 1rem; }
.rm-study-outcome { background: #f8fafc; border-left: 3px solid var(--rm-accent); display: grid; gap: .3rem; margin: 1rem 0; padding: .7rem .85rem; }
.rm-study-outcome span { color: #64748b; font-size: .62rem; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; }
.rm-study-outcome strong { color: #334155; font-size: .82rem; line-height: 1.5; }
.rm-study-order-note { color: #64748b; font-size: .72rem; margin: 1rem 0 1.25rem; }
.rm-study-start-actions { display: flex; margin: -0.55rem 0 1.4rem; }
.rm-study-reading-list { display: grid; gap: .7rem; }
.rm-study-reading-anchor { align-items: center; background: #fff; border: 1px solid var(--rm-border); border-radius: 10px; display: grid; gap: .8rem; grid-template-columns: 2rem minmax(0, 1fr) auto; min-width: 0; padding: .85rem; }
.rm-study-reading-anchor:hover { border-color: #bfdbfe; box-shadow: 0 7px 20px rgba(15,23,42,.06); }
.rm-study-reading-anchor__copy { display: grid; gap: .2rem; min-width: 0; }
.rm-study-reading-anchor__label { color: var(--rm-accent); font-size: .6rem; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
.rm-study-reading-anchor__copy strong { font-size: .86rem; overflow-wrap: anywhere; }
.rm-study-reading-anchor__location { color: #64748b; font-size: .64rem; overflow-wrap: anywhere; }
.rm-study-reading-anchor__copy p { color: #64748b; font-size: .74rem; line-height: 1.45; margin: .15rem 0 0; }
.rm-study-reading-anchor__open { white-space: nowrap; }
.rm-operation-grid, .rm-operation-landmark-grid { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.rm-operation-card { background: #fff; border: 1px solid var(--rm-border); border-radius: 10px; color: var(--rm-fg); cursor: pointer; display: flex; flex-direction: column; font: inherit; gap: .5rem; min-width: 0; padding: 1rem; text-align: left; }
.rm-operation-card:hover, .rm-operation-card:focus-visible { border-color: var(--rm-accent); box-shadow: 0 8px 22px rgba(15,23,42,.08); outline: none; }
.rm-operation-card__label { color: var(--rm-accent); font-size: .64rem; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; }
.rm-operation-card > strong, .rm-operation-landmark > strong { font-size: .92rem; line-height: 1.35; }
.rm-operation-card p { color: #475569; font-size: .76rem; line-height: 1.5; margin: 0; }
.rm-operation-card__literal { background: #0f172a; border-radius: 6px; color: #e2e8f0; display: block; font-size: .66rem; max-width: 100%; overflow-wrap: anywhere; padding: .45rem .55rem; white-space: pre-wrap; }
.rm-operation-card__meta { color: #64748b; font-size: .66rem; }
.rm-operation-card__action { color: var(--rm-accent); font-size: .72rem; font-weight: 750; margin-top: auto; padding-top: .2rem; }
.rm-operation-landmark { background: #fff; border: 1px solid var(--rm-border); border-radius: 10px; display: flex; flex-direction: column; gap: .5rem; min-width: 0; padding: .85rem; }
.rm-operation-order-note { background: #f8fafc; border-left: 3px solid var(--rm-accent); color: #475569; font-size: .78rem; line-height: 1.55; margin: 1rem 0; padding: .65rem .8rem; }
.rm-operation-action-list { display: grid; gap: 1.25rem; }
.rm-operation-action { min-width: 0; }
.rm-operation-action__heading { align-items: flex-start; display: grid; gap: .75rem; grid-template-columns: 2rem minmax(0, 1fr); }
.rm-operation-action__order { align-items: center; background: #ecfdf5; border-radius: 999px; color: #047857; display: inline-flex; font-size: .72rem; font-weight: 800; height: 2rem; justify-content: center; width: 2rem; }
.rm-operation-action__copy { display: grid; gap: .55rem; min-width: 0; }
.rm-operation-action__copy > strong { font-size: .88rem; line-height: 1.45; }
.rm-operation-literal { align-items: center; background: #0f172a; border-radius: 8px; display: flex; gap: .75rem; justify-content: space-between; min-width: 0; padding: .55rem .65rem; }
.rm-operation-literal code { color: #e2e8f0; font-size: .7rem; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.rm-operation-literal .rm-secondary-action { flex: 0 0 auto; }
.rm-operation-action > .rm-source-card { margin-left: 2.75rem; }
.rm-operation-result-list { display: grid; gap: .75rem; }
.rm-operation-result { align-items: start; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 9px; display: grid; gap: .6rem; padding: .8rem; }
.rm-operation-result__meta { align-items: center; display: flex; flex-wrap: wrap; gap: .45rem; }
.rm-operation-result__action { color: #475569; font-size: .68rem; font-weight: 750; }
.rm-operation-result__kind { background: #ecfdf5; border-radius: 999px; color: #047857; font-size: .64rem; font-weight: 750; padding: .2rem .45rem; }
.rm-operation-result__value { background: #0f172a; border-radius: 7px; color: #e2e8f0; display: block; font-size: .7rem; margin: 0; max-width: 100%; overflow-x: auto; overflow-wrap: anywhere; padding: .55rem .65rem; white-space: pre-wrap; }
.rm-operation-result__value--output { max-height: 16rem; }
.rm-operation-result > .rm-quiet-action { justify-self: start; }
.rm-purpose-hero p { font-size: 1rem; line-height: 1.65; margin-bottom: 0; }
.rm-overview-actions, .rm-mechanism-actions, .rm-step-actions, .rm-map-return { display: flex; flex-wrap: wrap; gap: .55rem; }
.rm-primary-action, .rm-secondary-action, .rm-quiet-action { border: 1px solid var(--rm-accent); border-radius: 7px; cursor: pointer; font: inherit; font-size: .78rem; font-weight: 650; padding: .5rem .75rem; }
.rm-primary-action { background: var(--rm-accent); color: #fff; }
.rm-secondary-action { background: #fff; color: var(--rm-accent); }
.rm-quiet-action { background: transparent; border-color: var(--rm-border); color: var(--rm-dim); }
.rm-primary-action:disabled, .rm-secondary-action:disabled, .rm-quiet-action:disabled { cursor: default; opacity: .38; }
.rm-mechanism-grid { display: grid; gap: .85rem; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.rm-mechanism-card { background: #fff; border: 1px solid var(--rm-border); border-radius: 10px; color: var(--rm-fg); cursor: pointer; display: flex; flex-direction: column; font: inherit; gap: .55rem; padding: 1rem; text-align: left; }
.rm-mechanism-card.is-primary { border-color: #93c5fd; box-shadow: inset 3px 0 0 var(--rm-accent); }
.rm-mechanism-card:hover, .rm-mechanism-card:focus-visible { border-color: var(--rm-accent); box-shadow: 0 8px 22px rgba(15, 23, 42, .08); outline: none; }
.rm-mechanism-card__label { color: var(--rm-accent); font-size: .66rem; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; }
.rm-mechanism-card strong { font-size: 1rem; line-height: 1.3; }
.rm-mechanism-card p { color: var(--rm-dim); font-size: .78rem; line-height: 1.5; margin: 0; }
.rm-mechanism-card .rm-mechanism-card__answer { color: #334155; }
.rm-mechanism-card__meta { color: #475569; font-size: .7rem; }
.rm-mechanism-card__phases, .rm-mechanism-card__files { border-top: 1px solid #eef2f7; display: grid; gap: .3rem; padding-top: .55rem; width: 100%; }
.rm-mechanism-card__phases span { color: #334155; font-size: .7rem; line-height: 1.35; }
.rm-mechanism-card__files { display: flex; flex-wrap: wrap; }
.rm-mechanism-card__files code { background: #f8fafc; border-radius: 4px; color: #475569; font-size: .61rem; max-width: 100%; overflow-wrap: anywhere; padding: .18rem .32rem; }
.rm-mechanism-card__action { color: var(--rm-accent); font-size: .76rem; font-weight: 700; margin-top: auto; padding-top: .35rem; }
.rm-mechanism-group-title { color: #334155; font-size: .82rem; margin: 1.6rem 0 .65rem; }
.rm-system-story { counter-reset: story; display: grid; gap: .65rem; list-style: none; margin: 0; padding: 0; }
.rm-system-story li { align-items: flex-start; background: #f8fafc; border: 1px solid var(--rm-border); border-radius: 9px; color: #334155; display: grid; font-size: .84rem; gap: .65rem; grid-template-columns: 1.65rem minmax(0, 1fr); line-height: 1.55; padding: .72rem .8rem; }
.rm-system-story li::before { align-items: center; background: #dbeafe; border-radius: 999px; color: #1d4ed8; content: counter(list-item); display: flex; font-size: .68rem; font-weight: 750; height: 1.65rem; justify-content: center; width: 1.65rem; }
.rm-repository-area-grid { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.rm-repository-area { background: #fff; border: 1px solid var(--rm-border); border-radius: 9px; color: var(--rm-fg); cursor: pointer; display: flex; flex-direction: column; font: inherit; gap: .32rem; min-width: 0; padding: .8rem; text-align: left; }
.rm-repository-area:hover, .rm-repository-area:focus-visible { border-color: var(--rm-accent); outline: none; }
.rm-repository-area strong { font-size: .8rem; }
.rm-repository-area__responsibility { color: var(--rm-dim); font-size: .7rem; line-height: 1.45; }
.rm-repository-area code { color: var(--rm-code); font-size: .61rem; overflow-wrap: anywhere; }
.rm-repository-area__action { color: var(--rm-accent); font-size: .66rem; font-weight: 700; margin-top: auto; padding-top: .25rem; }
.rm-read-next-grid { display: grid; gap: .65rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.rm-read-next-target { background: #fff; border: 1px solid var(--rm-border); border-radius: 9px; color: var(--rm-fg); cursor: pointer; display: flex; flex-direction: column; font: inherit; gap: .28rem; min-width: 0; padding: .75rem; text-align: left; }
.rm-read-next-target:hover, .rm-read-next-target:focus-visible { border-color: var(--rm-accent); outline: none; }
.rm-read-next-target strong { font-size: .78rem; }
.rm-read-next-target code { color: var(--rm-code); font-size: .62rem; overflow-wrap: anywhere; }
.rm-read-next-target span { color: var(--rm-accent); font-size: .66rem; font-weight: 700; }
.rm-mechanism-layout { display: grid; gap: 1.25rem; grid-template-columns: minmax(180px, 240px) minmax(0, 1fr); }
.rm-step-list { align-self: start; border-left: 2px solid var(--rm-border); display: flex; flex-direction: column; gap: .25rem; max-height: calc(100vh - 2rem); overflow-y: auto; position: sticky; top: 1rem; }
.rm-step-list button { background: none; border: 0; border-radius: 0 7px 7px 0; color: var(--rm-dim); cursor: pointer; font: inherit; font-size: .74rem; line-height: 1.35; padding: .55rem .65rem; text-align: left; }
.rm-step-list button:hover, .rm-step-list button:focus-visible { background: var(--rm-card); color: var(--rm-fg); outline: none; }
.rm-step-list button.is-active { background: #eff6ff; color: var(--rm-accent); font-weight: 650; }
.rm-mechanism-answer { color: #334155; font-size: .92rem; line-height: 1.65; }
.rm-mechanism-context { border-bottom: 1px solid var(--rm-border); border-top: 1px solid var(--rm-border); margin: 1rem 0 1.25rem; padding: .7rem 0; }
.rm-mechanism-context__label { color: #64748b; display: block; font-size: .63rem; font-weight: 750; letter-spacing: .06em; margin-bottom: .45rem; text-transform: uppercase; }
.rm-mechanism-context__items { display: flex; flex-wrap: wrap; gap: .45rem; }
.rm-context-item { background: #f8fafc; border: 1px solid var(--rm-border); border-radius: 7px; color: #334155; cursor: pointer; display: grid; font: inherit; gap: .1rem; max-width: 22rem; padding: .48rem .58rem; text-align: left; }
.rm-context-item:hover, .rm-context-item:focus-visible { border-color: var(--rm-accent); outline: none; }
.rm-context-item strong { font-size: .68rem; }
.rm-context-item span, .rm-context-item code { color: #64748b; font-size: .6rem; line-height: 1.35; overflow-wrap: anywhere; }
.rm-context-item .rm-context-item__action { color: var(--rm-accent); font-weight: 700; }
.rm-step-workspace { background: #fff; border: 1px solid var(--rm-border); border-radius: 11px; min-width: 0; overflow: visible; padding: clamp(1rem, 2.4vw, 1.5rem); }
.rm-step-progress { color: var(--rm-muted); font-size: .68rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.rm-step-workspace h3 { font-size: 1.15rem; margin: .35rem 0 .55rem; }
.rm-step-workspace h4 { font-size: .78rem; margin: 1.15rem 0 .35rem; }
.rm-step-explanation { color: #334155; font-size: .86rem; line-height: 1.65; }
.rm-step-actions.is-before { margin: .85rem 0 .2rem; }
.rm-step-actions.is-after { border-top: 1px solid var(--rm-border); margin-top: 1rem; padding-top: .8rem; }
.rm-implementation-details { border-top: 1px solid var(--rm-border); margin-top: 1rem; padding-top: .75rem; }
.rm-implementation-details > summary { color: var(--rm-accent); cursor: pointer; font-size: .75rem; font-weight: 700; }
.rm-implementation-details__list { display: grid; gap: .7rem; margin-top: .7rem; }
.rm-implementation-detail { background: #f8fafc; border: 1px solid var(--rm-border); border-radius: 8px; padding: .7rem; }
.rm-implementation-detail > strong { font-size: .74rem; }
.rm-implementation-detail > p { color: #475569; font-size: .7rem; line-height: 1.5; margin: .35rem 0 .55rem; }
.rm-mobile-step-controls { display: none; }
.rm-code-location-list, .rm-involved-files { display: flex; flex-direction: column; gap: .4rem; margin: .75rem 0; }
.rm-code-location { align-items: center; background: #f8fafc; border: 1px solid var(--rm-border); border-radius: 7px; color: var(--rm-code); cursor: pointer; display: flex; font: inherit; font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: .7rem; justify-content: space-between; gap: .75rem; padding: .55rem .65rem; text-align: left; }
.rm-code-location:hover, .rm-code-location:focus-visible { border-color: var(--rm-accent); outline: none; }
.rm-code-location span:last-child { color: var(--rm-accent); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: .65rem; font-weight: 650; white-space: nowrap; }
.rm-source-drawer { background: #fff; border-left: 1px solid var(--rm-border); box-sizing: border-box; height: calc(100vh - 65px); overflow: auto; overflow-x: hidden; padding: 1.25rem; position: sticky; top: 0; }
.rm-source-drawer__close { background: none; border: 0; color: var(--rm-dim); cursor: pointer; float: right; font-size: 1.35rem; line-height: 1; }
.rm-source-drawer h2 { font-size: 1rem; margin: .2rem 2rem .35rem 0; }
.rm-source-drawer p { color: var(--rm-dim); font-size: .76rem; }
.rm-source-drawer__path { background: #f8fafc; border-radius: 7px; display: block; font-size: .72rem; margin: .8rem 0; overflow-wrap: anywhere; padding: .65rem; }
.rm-source-card { background: #fff; border: 1px solid var(--rm-border); border-radius: 10px; margin: 1rem 0; min-width: 0; overflow: hidden; }
.rm-source-card.is-primary { border-color: #bfdbfe; box-shadow: 0 8px 24px rgba(37, 99, 235, .08); }
.rm-overview-landmark-list { display: grid; gap: .8rem; }
.rm-source-card.is-overview-landmark { margin: 0; }
.rm-source-card__heading { align-items: flex-start; display: flex; gap: 1rem; justify-content: space-between; padding: .8rem .9rem; }

  const TOKEN_WEIGHT = Object.freeze({
    verify: 3.2,
    response: 1.6,
    cache: 2.2,
    build: 1.8,
    report: 1.6,
    surface: 1.6,
    analyzer: 1.4,
    extend: 1.4,
    model: 1.1,
    component: 1.1,
  });

  function array(value) {
    return Array.isArray(value) ? value : [];
  }

  function text(value) {
    return value == null ? "" : String(value).trim();
  }

  function fold(value) {
    value = text(value);
    if (!value) return "";
    if (typeof value.normalize === "function") value = value.normalize("NFKC");
    return value.toLocaleLowerCase().replaceAll("ё", "е").replace(/\s+/g, " ").trim();
  }

  function protectedTechnicalTerms(value) {
    return fold(value)
      .replace(/golang\.org\s*\/\s*x\s*\/\s*tools\s*\/\s*go\s*\/\s*packages/g, " go_packages ")
      .replace(/\bgo\s*\/\s*packages\b/g, " go_packages ")
      .replace(/\bpackages\s*\.\s*load\b/g, " packages_load ");
  }

  function canonicalToken(token) {
    token = fold(token).replace(/^_+|_+$/g, "");
    if (!token || STOP_WORDS.has(token)) return "";
    if (token === "go_packages" || token === "packages_load") return token;
    if (/^(отчет|отчёт|report|reporting|html)$/.test(token)) return "report";
    if (/^(стро|собир|генер|build|built|generate|generated|render|rendered|produce|produces|assemble)/.test(token)) return "build";
    if (/^(deepseek)$/.test(token)) return "deepseek";
    if (/^(llm|model|models|модел)/.test(token)) return "model";
    if (/^(ответ|response|responses|output|outputs|result|results)$/.test(token)) return "response";
    if (/^(провер|валид|verify|verified|validation|validate|validated|allowlist|normalize)/.test(token)) return "verify";
    if (/^(runtime|рантайм|surface|surfaces|trigger|triggers|registration|registrations|route|routes|worker|workers|async|discovery)$/.test(token)) return "surface";
    if (/^(кеш|кэш)/.test(token) || /^(cache|cached|caching|replay)$/.test(token)) return "cache";
    if (/^(компон|component|components|subsystem|subsystems)$/.test(token)) return "component";
    if (/^(главн|основн|main|primary)$/.test(token)) return "main";
    if (/^(архитект|architecture|landscape|map|карта)$/.test(token)) return "architecture";
    if (/^(анализ|analyzer|analyzers|analysis|engine)$/.test(token)) return "analyzer";
    if (/^(добав|расшир|нов)/.test(token) || /^(add|added|adding|extend|extension|new)$/.test(token)) return "extend";
    if (/^(пакет|package|packages)$/.test(token)) return "package";
    if (/^(поток|flow|flows|trace|traces)$/.test(token)) return "flow";
    if (/^(go|golang)$/.test(token)) return "go";
    return token;
  }

  function tokenize(value) {
    const prepared = protectedTechnicalTerms(value)
      .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
      .replace(/[^\p{L}\p{N}_]+/gu, " ");
    const tokens = [];
    const seen = new Set();
    prepared.split(/\s+/).forEach((raw) => {
      const token = canonicalToken(raw);
      if (!token || seen.has(token)) return;
      seen.add(token);
      tokens.push(token);
    });
    return tokens;
  }

  function exactCandidate(value) {
    return protectedTechnicalTerms(value)
      .replace(/[^\p{L}\p{N}_./:-]+/gu, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function searchableItem(item) {
    const title = text(item && item.title);
    const question = text(item && item.question);
    const summary = text(item && item.summary);
    const aliases = array(item && item.aliases).map(text).filter(Boolean);
    const titleTokens = new Set(tokenize(title));
    const questionTokens = new Set(tokenize(question));
    const aliasTokens = new Set(tokenize(aliases.join(" ")));
    const summaryTokens = new Set(tokenize(summary));
    const exactCandidates = [title, question].concat(aliases).map(exactCandidate).filter(Boolean);
    return { item: item, title: title, question: question, summary: summary, aliases: aliases,
      titleTokens: titleTokens, questionTokens: questionTokens, aliasTokens: aliasTokens, summaryTokens: summaryTokens,
      exactCandidates: exactCandidates };
  }

  function exactMatch(candidates, query) {
    const wanted = exactCandidate(query);
    if (!wanted) return false;
    return candidates.some((candidate) => {
      if (candidate === wanted) return true;
      const segments = candidate.split(/[\/.:#-]+/).filter(Boolean);
      return segments.length > 0 && segments[segments.length - 1] === wanted;
    });
  }

  function rankSemanticSearchItems(items, query, limit) {
    limit = Math.max(1, Number(limit) || MAX_RESULTS);
    const queryTokens = tokenize(query);
    if (queryTokens.length === 0) return [];
    const foldedQuery = exactCandidate(query);
    const ranked = [];

    array(items).forEach((item) => {
      if (!item || !item.id || !item.target) return;
      const searchable = searchableItem(item);
      const isExact = exactMatch(searchable.exactCandidates, query);
      let score = Number(KIND_PRIORITY[item.kind] || 0);
      let matched = 0;
      const matchedTokens = [];

      queryTokens.forEach((token) => {
        let fieldWeight = 0;
        if (searchable.titleTokens.has(token)) fieldWeight = 80;
        else if (searchable.questionTokens.has(token)) fieldWeight = 55;
        else if (searchable.aliasTokens.has(token)) fieldWeight = 38;
        else if (searchable.summaryTokens.has(token)) fieldWeight = 28;
        if (!fieldWeight) return;
        matched++;
        matchedTokens.push(token);
        score += fieldWeight * Number(TOKEN_WEIGHT[token] || 1);
      });
      if (matched === 0 && !isExact) return;

      const titlePhrase = exactCandidate(searchable.title).includes(foldedQuery);
      const questionPhrase = exactCandidate(searchable.question).includes(foldedQuery);
      const aliasPhrase = searchable.exactCandidates.some((candidate) => candidate.includes(foldedQuery));
      const summaryPhrase = exactCandidate(searchable.summary).includes(foldedQuery);
      if (isExact) score += 4000;
      else if (titlePhrase) score += 900;
      else if (questionPhrase) score += 780;
      else if (aliasPhrase) score += 720;
      else if (summaryPhrase) score += 360;

      const coverage = matched / queryTokens.length;
      score += Math.round(coverage * 260);
      if (coverage === 1) score += 420;
      else score -= Math.round((1 - coverage) * 180);
      if ((item.kind === "location" || item.kind === "flow_step") && !isExact) score -= 120;
      const queryNamesExample = /\b(example|playground|пример)\b/.test(fold(query));
      if (!queryNamesExample && /\b(example|playground)\b/.test(fold(item.title))) score -= 180;

      ranked.push({
        item: item,
        score: Math.round(score),
        exact: isExact,
        complete: coverage === 1,
        coverage: coverage,
        matched_tokens: matchedTokens,
        query_tokens: queryTokens,
      });
    });

    ranked.sort((left, right) => {
      if (left.complete !== right.complete) return left.complete ? -1 : 1;
      if (left.score !== right.score) return right.score - left.score;
      const leftKind = Number(KIND_PRIORITY[left.item.kind] || 0);
      const rightKind = Number(KIND_PRIORITY[right.item.kind] || 0);
      if (leftKind !== rightKind) return rightKind - leftKind;
      const titleOrder = fold(left.item.title).localeCompare(fold(right.item.title));
      if (titleOrder !== 0) return titleOrder;
      return text(left.item.id).localeCompare(text(right.item.id));
    });
    return ranked.slice(0, limit);
  }

  function nextSearchIndex(current, delta, count) {
    count = Math.max(0, Number(count) || 0);
    if (count === 0) return -1;
    current = Number.isFinite(Number(current)) ? Number(current) : 0;
    return (current + Number(delta || 0) + count) % count;
  }

  function resultGroup(result) {
    const kind = text(result && result.item && result.item.kind);
    if ([
				"repository_story", "study_direction", "paved_path", "mechanism", "dependency_usage", "repository_pattern",
      "contribution_guide", "go_learning", "guided_tour", "guided_step",
    ].includes(kind)) return "Ready explanations";
    if (result && result.exact) return "Exact names and references";
    if (result && !result.complete) return "Related results";
    if (kind === "location" || kind === "flow_step" || kind === "member") return "Source code";
    if (kind === "unknown" || kind === "warning") return "Source code";
    return "Repository concepts";
  }

  function createElement(tag, className, content) {
    const node = global.document.createElement(tag);
    if (className) node.className = className;
    if (content != null) node.textContent = String(content);
    return node;
  }

  class SemanticSearchView {
    constructor(root, index, options) {
      this.root = root;
      this.index = index || {};
      this.options = options || {};
      this.items = array(this.index.items).filter((item) => {
        return typeof this.options.targetAvailable !== "function" ||
          this.options.targetAvailable(item && item.target, item);
      });
      this.itemByID = new Map(this.items.map((item) => [text(item.id), item]));
      this.results = [];
      this.activeIndex = -1;
      this.restoreFocus = null;
      this.restoringFocus = false;
      this.abort = new AbortController();
    }

    listen(target, type, handler, options) {
      const settings = Object.assign({}, options || {}, { signal: this.abort.signal });
      target.addEventListener(type, handler, settings);
    }

    presentationTitle(item) {
      if (typeof this.options.presentationTitle === "function") {
        const projected = text(this.options.presentationTitle(item));
        if (projected) return projected;
      }
      return text(item && item.title);
    }

    start() {
      if (!this.root || this.items.length === 0) {
        if (this.root) this.root.hidden = true;
        return this;
      }
      this.entry = this.root.querySelector("[data-semantic-search-entry]");
      this.suggestions = this.root.querySelector("[data-semantic-search-suggestions]");
      this.renderSuggestions();
      this.buildModal();
      if (this.entry) {
        this.listen(this.entry, "focus", () => {
          if (!this.restoringFocus) this.open(this.entry.value);
        });
        this.listen(this.entry, "click", () => this.open(this.entry.value));
        this.listen(this.entry, "keydown", (event) => {
          if (event.key === "Enter" || event.key === "ArrowDown") {
            event.preventDefault();
            this.open(this.entry.value);
          }
        });
      }
      this.listen(global, "keydown", (event) => {
        if (event.isComposing || event.altKey) return;
        if ((event.metaKey || event.ctrlKey) && fold(event.key) === "k") {
          event.preventDefault();
          this.open("");
        }
      });
      return this;
    }

    renderSuggestions() {
      if (!this.suggestions) return;
      this.suggestions.replaceChildren();
      array(this.index.suggestions).slice(0, 8).forEach((suggestion) => {
        const itemID = typeof suggestion === "string" ? suggestion : suggestion && suggestion.item_id;
        const item = this.itemByID.get(text(itemID));
        if (!item) return;
        const question = typeof suggestion === "object" && suggestion.question
          ? suggestion.question : this.suggestionQuestion(item);
        const button = createElement("button", "rm-semantic-search__suggestion", question);
        button.type = "button";
        button.title = "Open: " + this.presentationTitle(item);
        button.dataset.semanticSearchItem = text(item.id);
        this.listen(button, "click", () => this.activateItem(item));
        this.suggestions.appendChild(button);
      });
      this.suggestions.hidden = this.suggestions.childElementCount === 0;
    }

    suggestionQuestion(item) {
      if (text(item && item.question)) return text(item.question);
      const title = this.presentationTitle(item);
      switch (text(item && item.kind)) {
		case "paved_path": return "How do I use “" + title + "”?";
      case "guided_tour": return "Where should I start with “" + title + "”?";
      case "flow": return "How does “" + title + "” work?";
      case "surface": return "Where does “" + title + "” begin?";
      case "map": return "What are the main components?";
      case "direction": return "How does “" + title + "” work?";
      case "domain_term": return "What does “" + title + "” mean here?";
      case "component": return "What is “" + title + "” responsible for?";
      case "subsystem": return "What belongs to “" + title + "”?";
      case "flow_step": return "Where is “" + title + "” used?";
      case "location": return "What does “" + title + "” show?";
      default: return "Open “" + title + "”?";
      }
    }

    buildModal() {
      this.modal = createElement("div", "rm-search-modal");
      this.modal.hidden = true;
      this.backdrop = createElement("button", "rm-search-modal__backdrop");
      this.backdrop.type = "button";
      this.backdrop.tabIndex = -1;
      this.backdrop.setAttribute("aria-label", "Close search");
      this.dialog = createElement("section", "rm-search-modal__dialog");
      this.dialog.setAttribute("role", "dialog");
      this.dialog.setAttribute("aria-modal", "true");
      this.dialog.setAttribute("aria-labelledby", "rm-semantic-search-title");
      const header = createElement("header", "rm-search-modal__header");
      const heading = createElement("div");
      const title = createElement("h2", null, "What do you want to understand?");
      title.id = "rm-semantic-search-title";
      heading.appendChild(title);
      heading.appendChild(createElement("p", null, "Search saved explanations, the architecture map, and source references."));
      this.closeButton = createElement("button", "rm-search-modal__close", "Esc");
      this.closeButton.type = "button";
      this.closeButton.setAttribute("aria-label", "Close search");
      header.append(heading, this.closeButton);

      this.input = createElement("input", "rm-search-modal__input");
      this.input.type = "search";
      this.input.placeholder = "For example: request dispatch, report building, runtime surfaces";
      this.input.setAttribute("role", "combobox");
      this.input.setAttribute("aria-autocomplete", "list");
      this.input.setAttribute("aria-controls", "rm-semantic-search-results");
      this.input.setAttribute("aria-expanded", "true");
      this.status = createElement("p", "rm-search-modal__status");
      this.status.setAttribute("aria-live", "polite");
      this.resultHost = createElement("div", "rm-search-modal__results");
      this.resultHost.id = "rm-semantic-search-results";
      this.resultHost.tabIndex = -1;
      this.resultHost.setAttribute("role", "listbox");
      const footer = createElement("footer", "rm-search-modal__footer");
      footer.append(
        createElement("span", null, "↑↓ select"),
        createElement("span", null, "Enter open"),
        createElement("span", null, "Esc close")
      );
      this.dialog.append(header, this.input, this.status, this.resultHost, footer);
      this.modal.append(this.backdrop, this.dialog);
      global.document.body.appendChild(this.modal);

      this.listen(this.backdrop, "click", () => this.close(true));
      this.listen(this.closeButton, "click", () => this.close(true));
      this.listen(this.input, "input", () => {
        if (this.entry) this.entry.value = this.input.value;
        this.renderResults(this.input.value);
      });
      this.listen(this.input, "keydown", (event) => this.handleInputKey(event));
      this.listen(this.modal, "keydown", (event) => {
        if (event.key === "Escape") {
          event.preventDefault();
          event.stopPropagation();
          this.close(true);
        } else if (event.key === "Tab") {
          event.preventDefault();
          (global.document.activeElement === this.input ? this.closeButton : this.input).focus();
        }
      });
    }

    open(query) {
      if (!this.modal || this.items.length === 0) return;
      if (this.modal.hidden) this.restoreFocus = global.document.activeElement;
      this.modal.hidden = false;
      global.document.body.classList.add("rm-search-open");
      this.input.value = text(query);
      if (this.entry) this.entry.value = this.input.value;
      this.renderResults(this.input.value);
      global.requestAnimationFrame(() => {
        this.input.focus();
        this.input.select();
      });
    }

    close(restore) {
      if (!this.modal || this.modal.hidden) return;
      this.modal.hidden = true;
      global.document.body.classList.remove("rm-search-open");
      this.input.removeAttribute("aria-activedescendant");
      if (restore && this.restoreFocus && typeof this.restoreFocus.focus === "function") {
        this.restoringFocus = true;
        this.restoreFocus.focus();
        this.restoringFocus = false;
      }
      this.restoreFocus = null;
    }

    initialResults() {
      const seen = new Set();
      const results = [];
      array(this.index.suggestions).forEach((suggestion) => {
        const itemID = typeof suggestion === "string" ? suggestion : suggestion && suggestion.item_id;
        const item = this.itemByID.get(text(itemID));
        if (!item || seen.has(item.id)) return;
        seen.add(item.id);
        results.push({ item: item, score: 0, exact: false, complete: true, coverage: 1 });
      });
      return results.slice(0, 8);
    }

    renderResults(query) {
      this.results = text(query) ? rankSemanticSearchItems(this.items, query, MAX_RESULTS) : this.initialResults();
      this.activeIndex = this.results.length > 0 ? 0 : -1;
      this.resultHost.replaceChildren();
      if (this.results.length === 0) {
        this.input.removeAttribute("aria-activedescendant");
        this.status.textContent = "No matches.";
        const empty = createElement("div", "rm-search-modal__empty");
        empty.appendChild(createElement("strong", null, "No matches"));
        empty.appendChild(createElement(
          "p", null,
          "Try an exact component, flow, runtime entry, package, symbol, or file name."
        ));
        this.resultHost.appendChild(empty);
        return;
      }
      this.status.textContent = text(query)
        ? "Found: " + this.results.length
        : "Suggested starting points";
      let currentGroup = "";
      this.results.forEach((result, index) => {
        const group = resultGroup(result);
        if (group !== currentGroup) {
          currentGroup = group;
          this.resultHost.appendChild(createElement("h3", "rm-search-modal__group", group));
        }
        const button = createElement("button", "rm-search-modal__result");
        button.type = "button";
        button.id = "rm-semantic-search-option-" + index;
        button.setAttribute("role", "option");
        button.setAttribute("aria-selected", index === this.activeIndex ? "true" : "false");
        button.tabIndex = -1;
        const top = createElement("span", "rm-search-modal__result-top");
        top.appendChild(createElement("strong", null, this.presentationTitle(result.item)));
        top.appendChild(createElement("span", "rm-search-modal__kind", KIND_LABELS[result.item.kind] || result.item.kind));
        button.appendChild(top);
        if (result.item.question && result.item.question !== result.item.title) {
          button.appendChild(createElement("span", "rm-search-modal__summary", result.item.question));
        }
        if (result.item.summary) button.appendChild(createElement("span", "rm-search-modal__summary", result.item.summary));
        const action = createElement("span", "rm-search-modal__action", this.actionLabel(result.item.target));
        button.appendChild(action);
        this.listen(button, "click", () => this.activateIndex(index));
        this.resultHost.appendChild(button);
      });
      this.syncActiveResult(false);
    }

    actionLabel(target) {
      switch (text(target && target.kind)) {
      case "semantic_artifact": return "Open explanation →";
			case "study_direction": return "Open reading path →";
		case "paved_path": return "Open instructions →";
      case "guided_step": return "Go to step →";
      case "component": return "Show component on map →";
      case "flow": return "Open flow →";
      case "flow_step": return "Open exact step →";
      case "surface": return "Open runtime entry →";
      case "location": return "Open source →";
      default: return "Open full map →";
      }
    }

    handleInputKey(event) {
      if (event.isComposing) return;
      if (event.key === "ArrowDown") {
        event.preventDefault();
        this.activeIndex = nextSearchIndex(this.activeIndex, 1, this.results.length);
        this.syncActiveResult(true);
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        this.activeIndex = nextSearchIndex(this.activeIndex, -1, this.results.length);
        this.syncActiveResult(true);
      } else if (event.key === "Home" && this.results.length > 0) {
        event.preventDefault();
        this.activeIndex = 0;
        this.syncActiveResult(true);
      } else if (event.key === "End" && this.results.length > 0) {
        event.preventDefault();
        this.activeIndex = this.results.length - 1;
        this.syncActiveResult(true);
      } else if (event.key === "Enter" && this.activeIndex >= 0) {
        event.preventDefault();
        this.activateIndex(this.activeIndex);
      }
    }

    resultButtons() {
      return Array.from(this.resultHost.querySelectorAll(".rm-search-modal__result"));
    }

    syncActiveResult(scroll) {
      const buttons = this.resultButtons();
      buttons.forEach((button, index) => {
        const active = index === this.activeIndex;
        button.classList.toggle("is-active", active);
        button.setAttribute("aria-selected", active ? "true" : "false");
      });
      const active = buttons[this.activeIndex];
      if (!active) {
        this.input.removeAttribute("aria-activedescendant");
        return;
      }
      this.input.setAttribute("aria-activedescendant", active.id);
      if (scroll && typeof active.scrollIntoView === "function") active.scrollIntoView({ block: "nearest" });
    }

    activateIndex(index) {
      const result = this.results[index];
      if (result) this.activateItem(result.item);
    }

    activateItem(item) {
      if (!item || !item.target) return;
      this.close(false);
      if (typeof this.options.openTarget === "function") this.options.openTarget(item.target, item);
    }

    destroy() {
      this.abort.abort();
      if (this.modal) this.modal.remove();
    }
  }

  function mount(root, index, options) {
    return new SemanticSearchView(root, index, options).start();
  }

  global.RepomapSemanticSearch = Object.freeze({ mount: mount });
  if (global.__REPOMAP_SEARCH_TEST__ && typeof global.__REPOMAP_SEARCH_TEST__ === "object") {
    Object.assign(global.__REPOMAP_SEARCH_TEST__, {
      canonicalToken: canonicalToken,
      tokenize: tokenize,
      rankSemanticSearchItems: rankSemanticSearchItems,
      nextSearchIndex: nextSearchIndex,
      resultGroup: resultGroup,
    });
  }
})(window);

  function russianCount(value, one, few, many) {
    var number = Number(value);
    var mod100 = number % 100;
    var mod10 = number % 10;
    var form = mod10 === 1 && mod100 !== 11
      ? one
      : mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)
        ? few
        : many;
    return value + ' ' + form;
  }

  function translateUIString(value) {
    if (REPORT_LANGUAGE !== 'ru' || typeof value !== 'string' || value === '') return value;
    var trimmed = value.trim();
    var translated = RU_UI[trimmed];
    if (!translated) {
      var match = trimmed.match(/^Review (\d+) incomplete Study directions →$/);
      if (match) translated = 'Посмотреть неполные направления Study: ' + match[1] + ' →';
      match = match || trimmed.match(/^Show (\d+) more$/);
      if (!translated && match) translated = 'Показать ещё: ' + match[1];
      match = trimmed.match(/^Show all \((\d+)\)$/);
      if (!translated && match) translated = 'Показать все (' + match[1] + ')';
      match = trimmed.match(/^Start with (.+) →$/);
      if (!translated && match) translated = 'Начать с ' + match[1] + ' →';
      match = trimmed.match(/^Copied (.+)$/);
      if (!translated && match) translated = 'Скопировано: ' + match[1];
      match = trimmed.match(/^After action (\d+)$/);
      if (!translated && match) translated = 'После действия ' + match[1];
      match = trimmed.match(/^(\d+) (step|steps)$/);
      if (!translated && match) translated = russianCount(match[1], 'шаг', 'шага', 'шагов');
      match = trimmed.match(/^Showing (\d+) of (\d+) surfaces\.$/);
      if (!translated && match) translated = 'Показано surfaces: ' + match[1] + ' из ' + match[2] + '.';
      match = trimmed.match(/^(\d+) components?$/);
      if (!translated && match) translated = russianCount(match[1], 'компонент', 'компонента', 'компонентов');
      match = trimmed.match(/^(\d+) exact anchors?$/);
      if (!translated && match) translated = russianCount(match[1], 'точная опора', 'точные опоры', 'точных опор');
      match = trimmed.match(/^(\d+) surfaces · (\d+) exact anchors?$/);
      if (!translated && match) translated = match[1] + ' surfaces · ' +
        russianCount(match[2], 'точная опора', 'точные опоры', 'точных опор');
      match = trimmed.match(/^(\d+) surfaces? · (\d+) code paths? · (\d+) exact anchors?$/);
      if (!translated && match) translated =

        russianCount(match[2], 'путь в коде', 'пути в коде', 'путей в коде') + ' · ' +
        russianCount(match[3], 'точная опора', 'точные опоры', 'точных опор');
      match = trimmed.match(/^(\d+) exact members?$/);
      if (!translated && match) translated =
        russianCount(match[1], 'точный элемент', 'точных элемента', 'точных элементов');
      match = trimmed.match(/^Code paths \((\d+)\)(?: ([▾▴]))?$/);
      if (!translated && match) translated =
        'Пути в коде (' + match[1] + ')' + (match[2] ? ' ' + match[2] : '');
      match = trimmed.match(/^Production package (.+)\.$/);
      if (!translated && match) translated = 'Пакет production-кода ' + match[1] + '.';
      match = trimmed.match(/^Drag to explore · (\d+) architecture groups · Fit keeps labels readable$/);
      if (!translated && match) translated = 'Перетаскивайте карту · архитектурных групп: ' + match[1] + ' · кнопка «Вместить» сохраняет читаемость';
      match = trimmed.match(/^Inspect (.+) transition$/);
      if (!translated && match) translated = 'Изучить переход ' + match[1];
      match = trimmed.match(/^(.+) · lines (\d+)[–-](\d+)$/);
      if (!translated && match) translated = match[1] + ' · строки ' + match[2] + '–' + match[3];
    }

  function translatableElement(node) {
    if (!node || !node.parentElement) return false;
    return !/^(CODE|PRE|SCRIPT|STYLE|TEXTAREA|KBD)$/i.test(node.parentElement.tagName);

  function translateUIRoot(root) {
    if (REPORT_LANGUAGE !== 'ru' || !root) return;
    if (root.nodeType === Node.TEXT_NODE && translatableElement(root)) {
      root.nodeValue = translateUIString(root.nodeValue);
      return;

    if (root.nodeType !== Node.ELEMENT_NODE && root.nodeType !== Node.DOCUMENT_NODE) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    var node;
    while ((node = walker.nextNode())) {
      if (translatableElement(node)) node.nodeValue = translateUIString(node.nodeValue);

    if (root.nodeType === Node.ELEMENT_NODE) elements.push(root);
    Array.prototype.push.apply(elements, root.querySelectorAll ? root.querySelectorAll('[aria-label], [placeholder], [title]') : []);
    elements.forEach(function (element) {
      ['aria-label', 'placeholder', 'title'].forEach(function (attribute) {
        if (element.hasAttribute(attribute)) {
          element.setAttribute(attribute, translateUIString(element.getAttribute(attribute)));
        }
      });
    });

  function userMechanismByID(mechanisms, artifactID) {

  function mechanismNarrativeItems(mechanism) {

    return mechanism && Array.isArray(mechanism.steps) ? mechanism.steps.filter(Boolean) : [];

  function mechanismImplementationSteps(mechanism, phase) {

    var steps = Array.isArray(mechanism.steps) ? mechanism.steps : [];
    var seen = {};
    var indexed = (Array.isArray(phase.implementation_step_indexes)
      ? phase.implementation_step_indexes
      : []).map(function (index) {
        index = Number(index);

      ? phase.implementation_details.filter(Boolean)

  function narrativeIndexForImplementationStep(mechanism, stepIndex) {
    var items = mechanismNarrativeItems(mechanism);

    stepIndex = Number(stepIndex);
    for (var index = 0; index < items.length; index++) {
      var members = Array.isArray(items[index].implementation_step_indexes)
        ? items[index].implementation_step_indexes
        : [];
      if (members.some(function (candidate) { return Number(candidate) === stepIndex; })) return index;

    return 0;

    var steps = mechanismNarrativeItems(mechanism);

  function workspaceHashForState(state, mechanismRoot) {

	function workspaceRouteFamily(state) {

  function parseWorkspaceHash(hash, mechanisms, historyState) {
    hash = String(hash || '');
    var state = emptyWorkspaceState();
		var route = hash.replace(/^#/, '') || (TASK_INVESTIGATION ? defaultWorkspaceHash().replace(/^#/, '') : '/overview');
    var queryIndex = route.indexOf('?');
    var query = queryIndex >= 0 ? route.slice(queryIndex + 1) : '';

			} else {
				canonicalHash = '#/overview';
			}
		} else if (segments.length === 2 && segments[0] === 'investigate') {
			var routeTaskID = decodeRoutePart(segments[1]);
			if (!TASK_INVESTIGATION || routeTaskID !== TASK_INVESTIGATION.task_id) {

				state.taskID = routeTaskID;
				canonicalHash = defaultWorkspaceHash();

    } else if (segments.length === 1 && segments[0] === 'mechanisms') {
      state.view = mechanisms && mechanisms.length ? 'mechanisms' : 'overview';
      valid = state.view === 'mechanisms';
      canonicalHash = valid ? '#/mechanisms' : '#/overview';
		} else if (segments.length === 1 && segments[0] === 'study') {
			state.view = INCOMPLETE_STUDY_DIRECTIONS.length ? 'study_overview' : 'overview';

      state.view = 'provenance';

		} else if (segments.length === 2 && segments[0] === 'study') {

			if (!routeDirection) {

  function reduceWorkspaceState(state, action, mechanisms) {
    state = state || workspaceState;
    action = action || {};
    var next = {
      view: state.view || 'overview',
			taskID: state.taskID || '',
      artifactID: state.artifactID || '',
		directionID: state.directionID || '',
		operationID: state.operationID || '',
      stepIndex: Number(state.stepIndex) || 0,
      sourceLocation: state.sourceLocation || null,
      mapReturn: state.mapReturn || null,
      mapTarget: state.mapTarget || null,
    };
    var mechanism;
    switch (action.type) {
    case 'view':
      next.view = action.view === 'search' ? 'overview' : action.view || 'overview';
      if (next.view !== 'architecture') {
        next.mapTarget = null;
        if (!action.keepReturn) next.mapReturn = null;
      }
      return next;
    case 'open_mechanism':
      mechanism = userMechanismByID(mechanisms, action.artifactID);
      if (!mechanism) return next;
      next.view = 'mechanism';
      next.artifactID = mechanism.artifact_id;
		next.directionID = '';
		next.operationID = '';
      next.stepIndex = boundedMechanismStep(mechanism, action.stepIndex);
      next.mapTarget = null;
      next.mapReturn = null;
      return next;
		case 'open_study':
			var direction = studyDirectionByID(action.directionID);
			if (!direction || direction.mechanism_id) return next;
			next.view = 'study';
			next.directionID = direction.id;
			next.artifactID = '';
			next.operationID = '';
			next.stepIndex = 0;
			next.mapTarget = null;
			next.mapReturn = null;
			return next;
		case 'open_operation':
			var pavedPath = pavedPathByID(action.operationID);
			if (!pavedPath) return next;
			next.view = 'operate';
			next.operationID = pavedPath.id;
			next.artifactID = '';
			next.directionID = '';
			next.stepIndex = 0;
			next.mapTarget = null;
			next.mapReturn = null;
			return next;
    case 'select_step':
      mechanism = userMechanismByID(mechanisms, next.artifactID);
      if (!mechanism) return next;
      next.stepIndex = boundedMechanismStep(mechanism, action.stepIndex);
      return next;
    case 'move_step':
      mechanism = userMechanismByID(mechanisms, next.artifactID);
      if (!mechanism) return next;
      next.stepIndex = boundedMechanismStep(mechanism, next.stepIndex + Number(action.delta || 0));
      return next;
	case 'open_source':
		if (!action.selection || !action.selection.snippet ||
			!Array.isArray(action.selection.snippet.lines) || !action.selection.snippet.lines.length) return next;
		next.sourceLocation = action.selection;

      next.sourceLocation = null;
      return next;
    case 'show_map':
      if (!action.target) return next;
      next.mapReturn = { artifactID: next.artifactID, stepIndex: next.stepIndex };
      next.mapTarget = action.target;

      if (!next.mapReturn) return next;
		if (next.mapReturn.directionID) {

			if (!returnDirection) return next;
			next.view = 'study';
			next.directionID = returnDirection.id;
			next.artifactID = '';
			next.mapTarget = null;
			next.mapReturn = null;
			return next;
		}
      mechanism = userMechanismByID(mechanisms, next.mapReturn.artifactID);
      if (!mechanism) return next;
      next.view = 'mechanism';
      next.artifactID = mechanism.artifact_id;
      next.stepIndex = boundedMechanismStep(mechanism, next.mapReturn.stepIndex);
      next.mapTarget = null;
      next.mapReturn = null;

    }
  }

  function requestOpenFile(filePath, line, column) {

      return response.json().catch(function () { return {}; }).then(function (body) {

      var modulePath = modules[i].path || '';
      if (pkg === modulePath) return DATA.repo_name || modules[i].display_name || modulePath;
      if (modulePath && pkg.indexOf(modulePath + '/') === 0) return pkg.slice(modulePath.length + 1);
    }
    return pkg;
  }

  function appendLinkifiedText(container, statement) {
    if (!serverMode() || !statement || OPENABLE_PATHS.length === 0) {
      container.textContent = statement || '';
      return;
    }
    var cursor = 0;
    while (cursor < statement.length) {
      var nextPath = '';
      var nextIndex = -1;
      OPENABLE_PATHS.forEach(function (filePath) {
        var index = statement.indexOf(filePath, cursor);
        if (index >= 0 && (nextIndex < 0 || index < nextIndex)) {
          nextIndex = index;
          nextPath = filePath;
        }
      });
      if (nextIndex < 0) {
        container.appendChild(document.createTextNode(statement.slice(cursor)));
        break;
      }
      if (nextIndex > cursor) {
        container.appendChild(document.createTextNode(statement.slice(cursor, nextIndex)));
      }
      var end = nextIndex + nextPath.length;
      var line = 0;
      var remainder = statement.slice(end);
      var suffix = remainder.match(/^:(\d+)/);
      var label = nextPath;
      if (suffix) {
        line = parseInt(suffix[1], 10) || 0;
        label += suffix[0];
        end += suffix[0].length;
      }
      container.appendChild(renderFileReference(nextPath, 'rm-inline-file', line, label));
      cursor = end;
    }
  }

  function linkified(tag, cls, statement) {
    var node = el(tag, cls);
    appendLinkifiedText(node, statement);
    return node;
  }

  function setupServerFeatures() {
    if (!serverMode()) return;
    var hint = document.getElementById('rm-editor-hint');
    if (hint) hint.hidden = false;
    fetch(serverBasePath() + '/api/runs').then(function (response) {
      if (!response.ok) throw new Error('report list unavailable');
      return response.json();
    }).then(function (payload) {
      var runs = payload.runs || [];
      if (runs.length === 0) return;
      var picker = document.getElementById('rm-run-picker');
      var selector = document.getElementById('rm-run-selector');
      var selected = currentRunID();
      selector.innerHTML = '';
      runs.forEach(function (run) {
        var option = document.createElement('option');
        option.value = run.id;
        var label = run.repo_name || 'Saved repository report';
        var captured = String(run.created_at || '');
        var parsed = new Date(captured);
        if (!Number.isNaN(parsed.getTime())) {
          label += ' · ' + parsed.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
        }
        option.textContent = label;
        option.selected = run.id === selected;
        selector.appendChild(option);
      });
      selector.onchange = function () {
        window.location.assign(serverBasePath() + '/runs/' + encodeURIComponent(selector.value) + '/report.html');
      };
      picker.hidden = false;
    }).catch(function () {
      // The report remains fully usable when the optional server API is absent.
    });
  }

  function formatBytes(value) {
    if (!value || value < 0) return '';
    if (value < 1024) return value + ' B';
    if (value < 1024 * 1024) return (value / 1024).toFixed(1) + ' KiB';
    return (value / (1024 * 1024)).toFixed(1) + ' MiB';
  }

  function humanizeReason(reason) {
    if (!reason) return '';
    if (reason === 'likely_file from candidate_flow') {
      return 'Suggested by initial orientation';
    }

    var retrievalReason = reason.indexOf('exact basename match') >= 0 ||
      reason.indexOf('filename contains term') >= 0 ||
      reason.indexOf('directory segment') >= 0 ||
      reason.indexOf('path contains term') >= 0;
    if (!retrievalReason) return reason;

    var lower = reason.toLowerCase();
    if (lower.indexOf('raft') >= 0) return 'Matches Raft-related repository signals';
    if (lower.indexOf('grpc') >= 0 || lower.indexOf('rpc') >= 0) return 'Matches RPC-related repository signals';
    if (lower.indexOf('lease') >= 0) return 'Matches lease-related repository signals';
    if (lower.indexOf('wal') >= 0 || lower.indexOf('backend') >= 0 || lower.indexOf('mvcc') >= 0) {
      return 'Matches storage-related repository signals';
    }
    return 'Selected from repository signals';
  }

  function renderEvidenceBadge(confidence, verification) {
    var badge = el('span', 'rm-evidence ' + evidenceClass(confidence));
    badge.textContent = evidenceLabel(confidence);
    if (verification) badge.textContent = badge.textContent.replace('Model confidence', 'Evidence confidence');
    return badge;
  }

  function renderLocalVerification(verification) {
    if (!verification || (!verification.verified || !verification.verified.length) && (!verification.missing || !verification.missing.length)) {
      return null;
    }
    var box = el('div', 'rm-local-verification rm-local-verification--' + (verification.status || 'partial'));
    if (verification.verified && verification.verified.length) {
      box.appendChild(txt('div', 'rm-direction-label', LABELS.verifiedEvidence));
      verification.verified.forEach(function (statement) {
        var item = el('div', 'rm-verification-item rm-verification-item--verified');
        appendLinkifiedText(item, statement);
        box.appendChild(item);
      });
    }
    if (verification.missing && verification.missing.length) {

      verification.missing.forEach(function (statement) {
        box.appendChild(txt('div', 'rm-verification-item rm-verification-item--missing', statement));
      });
    }
    return box;
  }

  function proofAnchorMap(proof) {
    var result = {};
    (proof.anchors || []).forEach(function (anchor) { result[anchor.id] = anchor; });
    return result;
  }

  function proofStatusCounts(proof) {
    var counts = { verified: 0, partial: 0, missing: 0, unresolved: 0 };
    (proof.slots || []).forEach(function (slot) {
      counts[slot.status] = (counts[slot.status] || 0) + 1;
    });
    return counts;
  }

  function renderProofLocation(location, cls) {
    if (!location || !location.path) return null;
    var label = location.path + (location.line ? ':' + location.line : '');
    return renderFileReference(location.path, cls || 'rm-proof-location', location.line || 0, label);
  }

  function proofLocationMatches(left, right) {
    if (!left || !right) return false;
    return left.path === right.path && left.line === right.line && left.column === right.column;
  }

  function proofAnchorLabel(anchor, fallback) {
    return anchor && (anchor.label || anchor.qualified_name || anchor.id) || fallback;
  }

  function isCommandSetupTransition(transition, anchors) {
    var from = anchors[transition.from];
    var to = anchors[transition.to];
    return (transition.id || '').indexOf('dispatch-') === 0 ||
      transition.relation === 'registers_command' ||
      transition.relation === 'dispatches' ||
      from && from.kind === 'command' ||
      to && to.kind === 'command';
  }

  function proofStaticRelationGroups(proof) {
    var anchors = proofAnchorMap(proof);
    var transitions = (proof.transitions || []).slice();
    var transitionsByID = {};
    var assigned = {};
    transitions.forEach(function (transition) { transitionsByID[transition.id] = transition; });

    var commandSetup = transitions.filter(function (transition) {
      if (!isCommandSetupTransition(transition, anchors)) return false;
      assigned[transition.id] = true;
      return true;
    });

    var taskGroups = [];
    (proof.anchors || []).forEach(function (anchor) {
      if (anchor.kind !== 'task') return;
      var taskRelations = transitions.filter(function (transition) {
        if (assigned[transition.id]) return false;
        var belongsToTask = transition.from === anchor.id || transition.to === anchor.id;
        if (belongsToTask) assigned[transition.id] = true;
        return belongsToTask;
      });
      taskGroups.push({ title: 'Task · ' + proofAnchorLabel(anchor, anchor.id), anchor: anchor, relations: taskRelations });
    });

    var handlerAnchors = {};
    var applicationSlot = (proof.slots || []).filter(function (slot) {
      return slot.kind === 'application_callable';
    })[0];
    (applicationSlot && applicationSlot.evidence_ids || []).forEach(function (id) {
      var transition = transitionsByID[id];
      if (transition) handlerAnchors[transition.to] = true;
      if (anchors[id]) handlerAnchors[id] = true;
    });
    if (!Object.keys(handlerAnchors).length && commandSetup.length) {
      handlerAnchors[commandSetup[commandSetup.length - 1].to] = true;
    }

    var mainHandler = [];
    var foundRelation = true;
    while (foundRelation) {
      foundRelation = false;
      transitions.forEach(function (transition) {
        if (assigned[transition.id] || !handlerAnchors[transition.from]) return;
        if (anchors[transition.to] && anchors[transition.to].kind === 'task') return;
        assigned[transition.id] = true;
        mainHandler.push(transition);
        handlerAnchors[transition.to] = true;
        foundRelation = true;
      });
    }

    var other = transitions.filter(function (transition) { return !assigned[transition.id]; });
    var groups = [];
    if (commandSetup.length) groups.push({ title: 'Command setup', relations: commandSetup });
    if (mainHandler.length) groups.push({ title: 'Main handler branch', relations: mainHandler });
    taskGroups.forEach(function (group) { groups.push(group); });
    if (other.length) groups.push({ title: 'Other static relations', relations: other });
    return groups;
  }

  function appendProofNamedLocation(parent, label, location, duplicate) {
    if (!location || !location.path || duplicate && proofLocationMatches(location, duplicate)) return;
    var row = el('div', 'rm-proof-target');
    row.appendChild(document.createTextNode(label + ' '));
    row.appendChild(renderProofLocation(location, 'rm-proof-location'));
    parent.appendChild(row);
  }

  function renderProofStaticRelation(transition, anchors) {
    var from = anchors[transition.from];
    var to = anchors[transition.to];
    var row = el('div', 'rm-direction-evidence-item');
    var top = el('div', 'rm-proof-step-top');
    top.appendChild(txt('span', 'rm-proof-symbol', proofAnchorLabel(from, transition.from)));
    var relation = (transition.relation || 'related').replace(/_/g, ' ');
    var invocation = (transition.invocation || 'unknown').replace(/_/g, ' ');
    top.appendChild(txt('span', 'rm-proof-relation', '→ ' + relation + ' / ' + invocation + ' →'));
    top.appendChild(txt('span', 'rm-proof-symbol', proofAnchorLabel(to, transition.to)));
    row.appendChild(top);

    var semantics = [];
    if (transition.resolution) semantics.push(transition.resolution.replace(/_/g, ' ') + ' resolution');
    if (transition.certainty) semantics.push(transition.certainty + ' evidence');
    if (semantics.length) row.appendChild(txt('div', 'rm-proof-relation', semantics.join(' · ')));

    appendProofNamedLocation(row, 'evidence', transition.evidence, null);
    appendProofNamedLocation(row, 'from declaration', from && from.location, transition.evidence);
    appendProofNamedLocation(row, 'target declaration', to && to.location, transition.evidence);
    if (transition.condition) {
      var condition = el('div', 'rm-proof-target');
      condition.appendChild(document.createTextNode('condition' + (transition.condition.expression ? ' ' + transition.condition.expression : '')));
      if (transition.condition.location && transition.condition.location.path) {
        condition.appendChild(document.createTextNode(' at '));
        condition.appendChild(renderProofLocation(transition.condition.location, 'rm-proof-location'));
      }
      row.appendChild(condition);
    }
    return row;
  }

  function renderLocalProof(session, compact) {
    if (!session || !session.proof) return null;
    var proof = session.proof;
    var counts = proofStatusCounts(proof);
    var box = el('section', 'rm-flow-proof' + (compact ? ' rm-flow-proof--compact' : ''));
    var header = el('div', 'rm-proof-header');
    header.appendChild(txt('div', 'rm-direction-label', LABELS.verifiedFlow + ' · ' + (proof.archetype || 'flow')));
    header.appendChild(txt(
      'div',
      'rm-proof-summary',
      (proof.trace_quality || 'partial') + ' trace · ' + counts.verified + '/' + (proof.slots || []).length + ' slots verified'
    ));
    box.appendChild(header);

    var slots = el('div', 'rm-proof-slots');
    (proof.slots || []).forEach(function (slot) {
      var slotNode = txt('span', 'rm-proof-slot rm-proof-slot--' + (slot.status || 'missing'), slot.kind.replace(/_/g, ' '));
      slotNode.title = slot.summary || slot.missing || slot.status;
      slots.appendChild(slotNode);
    });
    box.appendChild(slots);

    if (!compact) {
      var anchors = proofAnchorMap(proof);
      var groups = proofStaticRelationGroups(proof);
      if (groups.length) {
        box.appendChild(txt('div', 'rm-direction-label rm-proof-path-label', 'Static relation groups'));
        box.appendChild(txt('div', 'rm-direction-hint', 'Grouped by static scope. Runtime order is not inferred.'));
        groups.forEach(function (group) {
          var groupNode = el('div', 'rm-direction-field');
          groupNode.appendChild(txt('div', 'rm-direction-label', group.title));
          if (group.anchor) appendProofNamedLocation(groupNode, 'task anchor', group.anchor.location, null);
          if (!group.relations.length) {
            groupNode.appendChild(txt('div', 'rm-proof-relation', 'No static relations captured for this task.'));
          }
          group.relations.forEach(function (transition) {
            groupNode.appendChild(renderProofStaticRelation(transition, anchors));
          });
          box.appendChild(groupNode);
        });
      }

      var stats = session.stats || {};
      var meta = el('div', 'rm-proof-meta');
      meta.appendChild(txt('span', '', (stats.tasks_completed || 0) + ' tasks'));
      meta.appendChild(txt('span', '', (stats.files || []).length + ' evidence files'));
      meta.appendChild(txt('span', '', (stats.symbols || []).length + ' symbols'));
      if (stats.wall_millis) meta.appendChild(txt('span', '', (stats.wall_millis / 1000).toFixed(1) + ' s local analysis'));
      box.appendChild(meta);
    }

    if (session.stop && session.stop.reason !== 'complete') {
      var boundary = el('div', 'rm-proof-boundary');
      boundary.appendChild(txt('span', 'rm-proof-boundary-label', LABELS.proofStop + ': '));
      boundary.appendChild(document.createTextNode(session.stop.reason.replace(/_/g, ' ') + (session.stop.message ? ' — ' + session.stop.message : '')));
      box.appendChild(boundary);
    }
    if (proof.current_frontier) {
      var frontier = el('div', 'rm-proof-boundary');
      frontier.appendChild(txt('span', 'rm-proof-boundary-label', 'Current frontier: '));
      frontier.appendChild(document.createTextNode(proof.current_frontier));
      box.appendChild(frontier);
    }
    return box;
  }

  function renderPill(text, kind) {
    var pill = el('span', 'rm-pill rm-pill--' + (kind || 'accent'));
    pill.textContent = text;
    return pill;
  }

  function renderFlowTypePill(flow) {
    var flowType = flow && flow.flow_type;
    if (flowType !== 'request' && flowType !== 'operational') return null;
    var label = flowType === 'operational' ? 'Operational' : 'Request';
    return renderPill(label, flowType);
  }

  function renderKindBadge(kind) {
    if (!kind) return null;
    var badge = el('span', 'rm-kind rm-kind--' + kind);
    badge.textContent = kind;
    return badge;
  }

  function renderFlowCard(flow, isRecommended) {
    var card = el('div', 'rm-ov-flow');
    if (isRecommended) card.classList.add('rm-ov-flow--recommended');

    if (flow.error) {
      card.classList.add('rm-ov-flow--error');
      var eh = el('div', 'rm-ov-flow-header');
      var eh3 = txt('h3', '', flow.name || flow.id);
      eh.appendChild(eh3);
      var errorFlowType = renderFlowTypePill(flow);
      if (errorFlowType) eh.appendChild(errorFlowType);
      eh.appendChild(renderPill(LABELS.errorUnavailable, 'error'));
      card.appendChild(eh);
      if (flow.bundle_stats_label) {
        var meta = txt('div', 'rm-meta', flow.bundle_stats_label);
        card.appendChild(meta);
      }
      card.onclick = function () { showTab('rm-flow-' + flow.id); };
      return card;
    }

    var header = el('div', 'rm-ov-flow-header');
    var h3 = txt('h3', '', flow.name || flow.id);
    header.appendChild(h3);
    var flowType = renderFlowTypePill(flow);
    if (flowType) header.appendChild(flowType);
    if (isRecommended) header.appendChild(renderPill(LABELS.startHere));
    card.appendChild(header);

    if (flow.summary) {
      var truncated = flow.summary.length > 100 ? flow.summary.slice(0, 100) + '...' : flow.summary;
      card.appendChild(linkified('div', 'rm-summary-line', truncated));
    }

    var preview = el('div', 'rm-ov-flow-preview');
    var previewFiles = flow.files_to_read_in_order;
    if ((!previewFiles || previewFiles.length === 0) && flow.bundle_files) {
      previewFiles = flow.bundle_files;
    }
    if (previewFiles && previewFiles.length > 0) {
      previewFiles.slice(0, 3).forEach(function (fi) {
        var p = el('div', 'rm-ov-flow-file');
        p.appendChild(renderFileReference(fi.path, '', 0, fi.path));
        preview.appendChild(p);
      });
    }
    card.appendChild(preview);

    var footer = el('div', 'rm-ov-flow-footer');
    if (!flow.evidence_only) footer.appendChild(renderEvidenceBadge(flow.confidence));
    if (flow.warnings && flow.warnings.length > 0) {
      footer.appendChild(txt('span', 'rm-ov-flow-stat', flow.warnings.length + ' warnings'));
    }
    if (flow.tests_to_read && flow.tests_to_read.length > 0) {
      footer.appendChild(txt('span', 'rm-ov-flow-stat', flow.tests_to_read.length + ' tests'));
    }
    card.appendChild(footer);

    card.onclick = function () { showTab('rm-flow-' + flow.id); };
    return card;
  }

  function candidateDirections() {
    if (DATA.candidate_directions && DATA.candidate_directions.length > 0) {
      return DATA.candidate_directions;
    }
    if (!DATA.candidate_flows) return [];
    return DATA.candidate_flows.map(function (candidate, index) {
      if (typeof candidate === 'string') {
        return { id: 'candidate-' + index, name: candidate };
      }
      return candidate;
    });
  }

  function architectureSourceLabel(value) {
    return {
      validated_model: 'validated model',
      normalized_model: 'normalized model',
      local_anchors: 'local anchors',
      package_fallback: 'package fallback'
    }[value] || 'unspecified';
  }

  function renderDirectionField(label, value, code) {
    if (!value) return null;
    var row = el('div', 'rm-direction-field');
    row.appendChild(txt('div', 'rm-direction-label', label));
    var body = el('div', code ? 'rm-direction-code' : 'rm-direction-value');
    if (code) appendLinkifiedText(body, value);
    else body.textContent = value;
    row.appendChild(body);
    return row;
  }

  function flowByID(id) {
    if (!id || !DATA.flows) return null;
    for (var i = 0; i < DATA.flows.length; i++) {
      if (DATA.flows[i].id === id) return DATA.flows[i];
    }
    return null;
  }

  function directionByID(id) {
    if (!id) return null;
    var directions = candidateDirections();
    for (var i = 0; i < directions.length; i++) {
      if (directions[i].id === id) return directions[i];
    }
    return null;
  }

  function renderDirectionContext(direction) {
    if (!direction) return null;

    var context = el('section', 'rm-direction-context');
    if (direction.why_interesting) {
      context.appendChild(linkified('p', 'rm-direction-purpose', direction.why_interesting));
    }

    var facts = el('div', 'rm-direction-context-facts');
    var trigger = renderDirectionField(LABELS.trigger, direction.trigger, false);
    if (trigger) facts.appendChild(trigger);
    var entrypoint = renderDirectionField(LABELS.likelyEntrypoint, direction.likely_entrypoint, true);
    if (entrypoint) facts.appendChild(entrypoint);
    if (facts.children.length > 0) context.appendChild(facts);

    var verification = renderLocalVerification(direction.local_verification);
    if (verification) context.appendChild(verification);

    var proof = renderLocalProof(direction.local_proof, false);
    if (proof) context.appendChild(proof);

    if (direction.evidence && direction.evidence.length > 0) {
      var evidence = el('div', 'rm-direction-context-evidence');
      evidence.appendChild(txt('div', 'rm-direction-label', LABELS.orientationEvidence));
      direction.evidence.forEach(function (statement) {
        var item = el('div', 'rm-direction-evidence-item');
        appendLinkifiedText(item, statement);
        evidence.appendChild(item);
      });
      context.appendChild(evidence);
    }

    return context;
  }

  function renderCandidateDirectionCard(direction, isSuggestedStart) {
    var card = el('div', 'rm-ov-flow rm-candidate-direction');

    var header = el('div', 'rm-ov-flow-header');
    header.appendChild(txt('h3', '', direction.name || direction.id));
    var directionFlowType = renderFlowTypePill(direction);
    if (directionFlowType) header.appendChild(directionFlowType);
    if (isSuggestedStart) header.appendChild(renderPill(LABELS.suggestedStart));
    if (direction.disposition === 'rejected') header.appendChild(renderPill('Not used as a flow'));
    header.appendChild(renderEvidenceBadge(direction.confidence, direction.local_verification));
    card.appendChild(header);

    if (direction.why_interesting) {
      card.appendChild(linkified('div', 'rm-summary-line', direction.why_interesting));
    }
    if (direction.disposition === 'rejected' && direction.disposition_reason) {
      card.appendChild(txt('div', 'rm-direction-hint', direction.disposition_reason));
    }

    var trigger = renderDirectionField(LABELS.trigger, direction.trigger, false);
    if (trigger) card.appendChild(trigger);

    var entrypoint = renderDirectionField(LABELS.likelyEntrypoint, direction.likely_entrypoint, true);
    if (entrypoint) card.appendChild(entrypoint);

    var verification = renderLocalVerification(direction.local_verification);
    if (verification) card.appendChild(verification);

    var proof = renderLocalProof(direction.local_proof, true);
    if (proof) card.appendChild(proof);

    if (direction.likely_files && direction.likely_files.length > 0) {
      var files = el('div', 'rm-direction-field');
      files.appendChild(txt('div', 'rm-direction-label', LABELS.likelyFiles));
      direction.likely_files.forEach(function (path) {
        var file = el('div', 'rm-direction-code');
        file.appendChild(renderFileReference(path, '', 0, path));
        files.appendChild(file);
      });
      card.appendChild(files);
    }

    if (direction.evidence && direction.evidence.length > 0) {
      var evidence = el('div', 'rm-direction-evidence');
      evidence.appendChild(txt('div', 'rm-direction-label', LABELS.orientationEvidence));
      direction.evidence.forEach(function (statement) {
        var item = el('div', 'rm-direction-evidence-item');
        appendLinkifiedText(item, statement);
        evidence.appendChild(item);
      });
      card.appendChild(evidence);
    }

    var focused = flowByID(direction.id);
    if (focused && direction.disposition !== 'rejected') {
      card.classList.add('rm-candidate-direction--clickable');
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.appendChild(txt('div', 'rm-direction-action', LABELS.openLocalEvidence));
      var openFocused = function () { showTab('rm-flow-' + focused.id); };
      card.onclick = openFocused;
      card.onkeydown = function (event) {
