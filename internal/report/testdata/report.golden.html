<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>repomap — testrepo — test project</title>
  <style>:root { --rm-bg: #fff; --rm-fg: #1a1a1a; --rm-card: #f5f5f5; --rm-border: #e0e0e0; --rm-accent: #2563eb; --rm-dim: #666; --rm-code: #d63384; --rm-good: #16a34a; --rm-warn: #ca8a04; --rm-bad: #dc2626; --rm-info: #0ea5e9; --rm-muted: #9ca3af; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; background: var(--rm-bg); color: var(--rm-fg); line-height: 1.5; font-size: 14px; }
header { background: linear-gradient(135deg, #1e293b, #334155); color: #fff; padding: 2rem; }
header h1 { margin: 0 0 .25rem; font-size: 1.5rem; }
header p { margin: 0; opacity: .8; font-size: .9rem; }
.rm-artifacts { font-size: .8rem; opacity: .6; margin-top: .5rem; font-family: monospace; }
.rm-container { max-width: 960px; margin: 0 auto; padding: 1.5rem; }

/* Tabs */
.rm-tabs { display: flex; gap: 0; border-bottom: 2px solid var(--rm-border); margin-bottom: 1.5rem; flex-wrap: wrap; }
.rm-tab { padding: .6rem 1rem; cursor: pointer; background: none; border: none; font-size: .85rem; color: var(--rm-dim); border-bottom: 2px solid transparent; margin-bottom: -2px; transition: .15s; white-space: nowrap; }
.rm-tab:hover { color: var(--rm-fg); }
.rm-tab.rm-active { color: var(--rm-accent); border-bottom-color: var(--rm-accent); font-weight: 600; }
.rm-tab.rm-tab--error { color: var(--rm-bad); }
.rm-tab.rm-tab--warn { color: var(--rm-warn); }
.rm-tab.rm-tab--partial { color: var(--rm-muted); }

.rm-tab-content { display: none; }
.rm-tab-content.rm-active { display: block; }

/* Evidence badges */
.rm-evidence { display: inline-block; padding: .15rem .6rem; border-radius: 12px; font-size: .75rem; font-weight: 600; }
.rm-ev-strong { background: #dcfce7; color: var(--rm-good); }
.rm-ev-medium { background: #fef9c3; color: var(--rm-warn); }
.rm-ev-weak { background: #f3f4f6; color: var(--rm-dim); }
.rm-ev-none { background: #f9fafb; color: var(--rm-muted); }

/* Kind badges */
.rm-kind { display: inline-block; padding: 0 .35rem; border-radius: 4px; font-size: .65rem; font-weight: 600; margin-left: .35rem; text-transform: uppercase; vertical-align: middle; }
.rm-kind--source { background: #dbeafe; color: var(--rm-accent); }
.rm-kind--test { background: #dcfce7; color: var(--rm-good); }
.rm-kind--doc { background: #fef3c7; color: var(--rm-warn); }
.rm-kind--proto { background: #f3e8ff; color: #9333ea; }
.rm-kind--config { background: #e0f2fe; color: var(--rm-info); }

/* Cards */
.rm-card { background: var(--rm-card); border: 1px solid var(--rm-border); border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }

/* Section titles */
.rm-section-title { font-size: .8rem; font-weight: 600; color: var(--rm-dim); text-transform: uppercase; letter-spacing: .05em; margin: 1.25rem 0 .5rem; }

/* Overview flow cards */
.rm-overview-flows { display: flex; flex-wrap: wrap; gap: .75rem; }
.rm-ov-flow { background: var(--rm-bg); border: 1px solid var(--rm-border); border-radius: 8px; padding: 1rem; flex: 1 1 220px; min-width: 200px; cursor: pointer; transition: box-shadow .15s; display: flex; flex-direction: column; }
.rm-ov-flow:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.rm-ov-flow-header { display: flex; align-items: center; gap: .35rem; flex-wrap: wrap; margin-bottom: .25rem; }
.rm-ov-flow h3 { margin: 0; font-size: .85rem; }
.rm-ov-flow .rm-summary-line { font-size: .78rem; color: var(--rm-dim); margin-bottom: .5rem; }
.rm-ov-flow-preview { flex: 1; margin: .25rem 0; }
.rm-ov-flow-file { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: .72rem; color: var(--rm-code); padding: .1rem 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rm-ov-flow-footer { display: flex; gap: .75rem; align-items: center; margin-top: .5rem; }
.rm-ov-flow-stat { font-size: .7rem; color: var(--rm-dim); }
.rm-ov-flow .rm-meta { font-size: .75rem; color: var(--rm-dim); margin-top: .35rem; }

/* Start Here accent */
.rm-ov-flow.rm-ov-flow--recommended { border-left: 3px solid var(--rm-accent); }
.rm-pill { display: inline-block; padding: .1rem .45rem; border-radius: 10px; font-size: .65rem; font-weight: 600; margin-left: .25rem; }
.rm-pill--accent { background: #dbeafe; color: var(--rm-accent); }
.rm-pill--error { background: #fecaca; color: var(--rm-bad); }

/* Waterfall timeline */
.rm-chain { position: relative; padding-left: 1.5rem; margin: 1rem 0; }
.rm-chain::before { content: ''; position: absolute; left: .6rem; top: .4rem; bottom: .4rem; width: 2px; background: var(--rm-border); }
.rm-chain-step { position: relative; margin-bottom: 1.25rem; }
.rm-chain-step:last-child { margin-bottom: 0; }
.rm-chain-circle { position: absolute; left: -1.5rem; top: .15rem; width: 1.2rem; height: 1.2rem; border-radius: 50%; background: #1e293b; color: #fff; display: flex; align-items: center; justify-content: center; font-size: .65rem; font-weight: 700; z-index: 1; }
.rm-chain-circle.rm-chain-circle--hi { background: var(--rm-good); }
.rm-chain-circle.rm-chain-circle--md { background: var(--rm-warn); }
.rm-chain-circle.rm-chain-circle--lo { background: var(--rm-dim); }
.rm-chain-circle.rm-chain-circle--none { background: var(--rm-border); color: var(--rm-dim); }
.rm-chain-body { background: var(--rm-bg); border: 1px solid var(--rm-border); border-radius: 6px; padding: .75rem 1rem; }
.rm-chain-name { font-weight: 600; font-size: .82rem; margin-bottom: .2rem; }
.rm-chain-desc { font-size: .78rem; color: var(--rm-dim); margin-bottom: .35rem; line-height: 1.4; }
.rm-chain-meta { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; font-size: .75rem; }
.rm-chain-files { font-size: .75rem; color: var(--rm-dim); margin-top: .35rem; }
.rm-chain-files-label { font-size: .72rem; font-weight: 600; }
.rm-chain-file-row { display: flex; gap: .75rem; align-items: baseline; padding: .12rem 0; }
.rm-chain-file { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: .75rem; color: var(--rm-code); }
.rm-chain-file-reason { font-size: .72rem; color: var(--rm-dim); }

/* Read Order */
.rm-read-order { margin: .5rem 0; }
.rm-read-order-item { padding: .55rem 0; border-bottom: 1px solid var(--rm-border); display: flex; gap: .75rem; align-items: flex-start; }
.rm-read-order-item:last-child { border-bottom: none; }
.rm-read-order-num { flex-shrink: 0; width: 1.75rem; height: 1.75rem; border-radius: 50%; background: var(--rm-accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; margin-top: .1rem; }
.rm-read-order-num--p2 { background: var(--rm-dim); }
.rm-read-order-num--p3 { background: var(--rm-border); color: var(--rm-dim); }
.rm-read-order-body { flex: 1; min-width: 0; }
.rm-read-order-path-row { display: flex; align-items: center; gap: .35rem; flex-wrap: wrap; }
.rm-read-order-path { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: .85rem; color: var(--rm-code); font-weight: 600; word-break: break-all; }
.rm-read-order-reason { font-size: .78rem; color: var(--rm-dim); margin-top: .15rem; line-height: 1.4; }
.rm-read-order-expand { padding: .5rem 0 0 2.5rem; }
.rm-expand-btn { background: none; border: 1px solid var(--rm-border); border-radius: 6px; padding: .35rem .75rem; cursor: pointer; font-size: .78rem; color: var(--rm-accent); }
.rm-expand-btn:hover { background: var(--rm-card); }

/* File lists */
.rm-file-list { list-style: none; padding: 0; margin: .5rem 0; }
.rm-file-list li { padding: .35rem 0; border-bottom: 1px solid var(--rm-border); }
.rm-file-list-item { display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap; }
.rm-file-path { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: .85rem; color: var(--rm-code); word-break: break-all; }
.rm-file-reason { font-size: .75rem; color: var(--rm-dim); }

/* Tags */
.rm-tags { display: flex; flex-wrap: wrap; gap: .35rem; margin: .5rem 0; }
.rm-tag { background: var(--rm-border); padding: .15rem .5rem; border-radius: 6px; font-size: .78rem; }

/* Boxes */
.rm-error-box { background: #fecaca; border: 1px solid var(--rm-bad); color: var(--rm-bad); border-radius: 6px; padding: .75rem; margin: .5rem 0; font-size: .82rem; }
.rm-warn-box { background: #fef9c3; border: 1px solid var(--rm-warn); border-radius: 6px; padding: .75rem; margin: .5rem 0; font-size: .82rem; }
.rm-warn-box strong { display: block; margin-bottom: .25rem; }
.rm-info-box { background: #e0f2fe; border: 1px solid var(--rm-info); border-radius: 6px; padding: .75rem; margin: .5rem 0; font-size: .82rem; }
.rm-info-box strong { display: block; margin-bottom: .25rem; }

/* Expandable items */
.rm-exp-item { margin-top: .2rem; font-size: .82rem; }
.rm-exp-hidden { display: none; }
.rm-expand-btn-inline { background: none; border: none; cursor: pointer; font-size: .75rem; color: var(--rm-accent); padding: .2rem 0 0; display: block; }
.rm-expand-btn-inline:hover { text-decoration: underline; }

/* Collapsible */
.rm-collapsible { margin: .5rem 0; }
.rm-collapsible-toggle { background: none; border: 1px solid var(--rm-border); border-radius: 6px; padding: .5rem .75rem; cursor: pointer; font-size: .78rem; color: var(--rm-dim); width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; }
.rm-collapsible-toggle:hover { background: var(--rm-card); }
.rm-collapsible-toggle::after { content: '▸'; font-size: .7rem; transition: transform .15s; }
.rm-collapsible.rm-collapsible--open .rm-collapsible-toggle::after { transform: rotate(90deg); }
.rm-collapsible-body { display: none; padding: .5rem 0 0; }
.rm-collapsible.rm-collapsible--open .rm-collapsible-body { display: block; }

/* Bundle stat lines */
.rm-bundle-stat { font-size: .8rem; padding: .1rem 0; font-family: monospace; color: var(--rm-dim); }

/* Summary */
.rm-summary { font-size: .9rem; margin: .25rem 0 .75rem; color: var(--rm-dim); line-height: 1.6; max-height: 4.8em; overflow: hidden; }
.rm-summary.rm-summary--expanded { max-height: none; }

/* Flow header */
.rm-flow-header { display: flex; align-items: center; gap: .75rem; margin-bottom: 1rem; flex-wrap: wrap; }
.rm-flow-header h2 { margin: 0; font-size: 1.05rem; }

/* Quick Start */
.rm-quick-start { margin-top: 1rem; }
.rm-quick-start-item { padding: .3rem 0; font-size: .82rem; display: flex; gap: .5rem; }
.rm-quick-start-flow { color: var(--rm-accent); cursor: pointer; }
.rm-quick-start-flow:hover { text-decoration: underline; }

/* Error flow card in overview */
.rm-ov-flow.rm-ov-flow--error { opacity: .7; }

/* Placeholder */
.rm-placeholder { background: var(--rm-card); border: 1px dashed var(--rm-border); border-radius: 6px; padding: .75rem; font-size: .82rem; color: var(--rm-dim); margin: .5rem 0; }

/* Fallback heading */
.rm-fallback-heading { font-size: .95rem; font-weight: 600; color: var(--rm-warn); margin: 1rem 0 .75rem; padding: .75rem; background: #fef9c3; border: 1px solid var(--rm-warn); border-radius: 6px; }
</style>
</head>
<body>
  <header>
    <h1 id="rm-repo-name"></h1>
    <p id="rm-project-guess"></p>
    <div class="rm-artifacts" id="rm-artifacts-dir"></div>
  </header>
  <div class="rm-container">
    <nav class="rm-tabs" id="rm-tabs"></nav>
    <section id="rm-overview" class="rm-tab-content rm-active"></section>
    <div id="rm-flows-container"></div>
  </div>
  <noscript><p>This report requires JavaScript. The raw data is available in <code>report.json</code>.</p></noscript>
  <script type="application/json" id="rm-report-data">{"format_version":2,"repo_name":"testrepo","project_guess":"test project","candidate_flows":["flow-a"],"flows":[{"id":"flow-a","name":"Test Flow","summary":"does something interesting","confidence":0.75,"likely_chain":[{"step":1,"name":"start","what_happens":"begins execution","evidence_files":["main.go"],"confidence":0.8}],"files_to_read_in_order":[{"path":"main.go","reason":"entrypoint","priority":1},{"path":"server/server.go","reason":"request routing","priority":2}],"tests_to_read":[{"path":"main_test.go","reason":"integration test","priority":0}],"unverified_paths":[{"path":"legacy.go","reason":"may be unused"}],"unknowns":["How does auth interact?"],"warnings":["Low confidence in step 1"],"bundle_summary":{"selected_files_count":5,"selected_tests_count":2,"selected_docs_count":1,"selected_packages_count":3,"related_edges_count":4},"confidence_label":"strong","bundle_stats_label":"5 source, 2 test, 1 doc"}],"artifacts_dir":"/tmp/test-run","warnings":["global warning 1"],"recommended_flow":"flow-a","flow_count":1}</script>
  <script>(function () {
  'use strict';

  var DATA = JSON.parse(document.getElementById('rm-report-data').textContent);

  var LABELS = {
    candidateFlows: 'Flows',
    filesToRead: 'Read order — open these files in sequence',
    testsToRead: 'Tests',
    executionChain: 'Execution chain',
    knownUnknowns: 'Known unknowns',
    unverified: 'Unverified paths',
    unknowns: 'Unknowns',
    warnings: 'Warnings',
    retrievalDetails: 'Retrieval details',
    noFlows: 'No flows identified.',
    startHere: 'Start here',
    quickStart: 'Quick start',
    noAIExplanation: 'No AI explanation — rerun with DEEPSEEK_API_KEY.',
    errorUnavailable: 'Analysis unavailable',
    evidenceFiles: 'Evidence files',
    showAll: 'Show all ({count})',
    showMore: 'Show {count} more',
    showLess: 'Show less',
  };

  function esc(s) {
    if (!s) return '';
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function evidenceClass(c) {
    var v = Math.max(0, c || 0);
    if (v <= 0) return 'rm-ev-none';
    return v >= 0.7 ? 'rm-ev-strong' : v >= 0.4 ? 'rm-ev-medium' : 'rm-ev-weak';
  }

  function evidenceLabel(c) {
    var v = Math.max(0, c || 0);
    if (v <= 0) return 'Evidence: not estimated';
    if (v >= 0.7) return 'Evidence: strong';
    if (v >= 0.4) return 'Evidence: medium';
    return 'Evidence: weak';
  }

  function chainCircleClass(c) {
    var v = Math.max(0, c || 0);
    if (v <= 0) return 'rm-chain-circle--none';
    return v >= 0.7 ? 'rm-chain-circle--hi' : v >= 0.4 ? 'rm-chain-circle--md' : 'rm-chain-circle--lo';
  }

  function kindClass(kind) {
    if (!kind) return '';
    return 'rm-kind rm-kind--' + kind;
  }

  // ── DOM builders ───────────────────────────────────────────────

  function el(tag, cls, attrs) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (attrs) Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    return e;
  }

  function txt(tag, cls, text) {
    var e = el(tag, cls);
    e.textContent = text || '';
    return e;
  }

  // ── Components ──────────────────────────────────────────────────

  function renderEvidenceBadge(confidence) {
    var badge = el('span', 'rm-evidence ' + evidenceClass(confidence));
    badge.textContent = evidenceLabel(confidence);
    return badge;
  }

  function renderPill(text, kind) {
    var pill = el('span', 'rm-pill rm-pill--' + (kind || 'accent'));
    pill.textContent = text;
    return pill;
  }

  function renderKindBadge(kind) {
    if (!kind) return null;
    var badge = el('span', 'rm-kind rm-kind--' + kind);
    badge.textContent = kind;
    return badge;
  }

  function renderFlowCard(flow, isRecommended) {
    var card = el('div', 'rm-ov-flow');
    if (isRecommended) card.classList.add('rm-ov-flow--recommended');

    if (flow.error) {
      card.classList.add('rm-ov-flow--error');
      var eh = el('div', 'rm-ov-flow-header');
      var eh3 = txt('h3', '', flow.name || flow.id);
      eh.appendChild(eh3);
      eh.appendChild(renderPill(LABELS.errorUnavailable, 'error'));
      card.appendChild(eh);
      if (flow.bundle_stats_label) {
        var meta = txt('div', 'rm-meta', flow.bundle_stats_label);
        card.appendChild(meta);
      }
      card.onclick = function () { showTab('rm-flow-' + flow.id); };
      return card;
    }

    var header = el('div', 'rm-ov-flow-header');
    var h3 = txt('h3', '', flow.name || flow.id);
    header.appendChild(h3);
    if (isRecommended) header.appendChild(renderPill(LABELS.startHere));
    card.appendChild(header);

    if (flow.summary) {
      var truncated = flow.summary.length > 100 ? flow.summary.slice(0, 100) + '...' : flow.summary;
      card.appendChild(txt('div', 'rm-summary-line', truncated));
    }

    var preview = el('div', 'rm-ov-flow-preview');
    if (flow.files_to_read_in_order && flow.files_to_read_in_order.length > 0) {
      flow.files_to_read_in_order.slice(0, 3).forEach(function (fi) {
        var p = txt('div', 'rm-ov-flow-file', fi.path);
        preview.appendChild(p);
      });
    }
    card.appendChild(preview);

    var footer = el('div', 'rm-ov-flow-footer');
    footer.appendChild(renderEvidenceBadge(flow.confidence));
    if (flow.warnings && flow.warnings.length > 0) {
      footer.appendChild(txt('span', 'rm-ov-flow-stat', flow.warnings.length + ' warnings'));
    }
    if (flow.tests_to_read && flow.tests_to_read.length > 0) {
      footer.appendChild(txt('span', 'rm-ov-flow-stat', flow.tests_to_read.length + ' tests'));
    }
    card.appendChild(footer);

    card.onclick = function () { showTab('rm-flow-' + flow.id); };
    return card;
  }

  function buildFileReasonIndex(filesToRead) {
    var idx = {};
    if (!filesToRead) return idx;
    filesToRead.forEach(function (fi) {
      if (fi.reason) idx[fi.path] = fi.reason;
    });
    return idx;
  }

  function renderChainSteps(chain, filesToRead) {
    var reasonIndex = buildFileReasonIndex(filesToRead);

    var section = el('div');
    section.appendChild(txt('div', 'rm-section-title', LABELS.executionChain));

    var container = el('div', 'rm-chain');

    chain.forEach(function (s) {
      var hasName = s.name && s.name.length > 0;
      var hasWhat = s.what_happens && s.what_happens.length > 0;
      var hasEvidence = s.evidence_files && s.evidence_files.length > 0;

      var stepWhat = s.what_happens;
      var stepName = s.name;

      if (!hasWhat && hasEvidence) {
        for (var i = 0; i < s.evidence_files.length; i++) {
          var r = reasonIndex[s.evidence_files[i]];
          if (r) { stepWhat = r; break; }
        }
      }
      if (!hasName && hasEvidence) {
        var fname = s.evidence_files[0];
        var last = fname.split('/').pop();
        stepName = last || fname;
      }

      if (!hasEvidence && !stepWhat) return;

      var step = el('div', 'rm-chain-step');

      var circle = el('div', 'rm-chain-circle ' + chainCircleClass(s.confidence));
      circle.textContent = s.step;
      step.appendChild(circle);

      var body = el('div', 'rm-chain-body');

      if (stepName) {
        body.appendChild(txt('div', 'rm-chain-name', 'Step ' + s.step + ': ' + stepName));
      } else {
        body.appendChild(txt('div', 'rm-chain-name', 'Step ' + s.step));
      }

      if (stepWhat) {
        body.appendChild(txt('div', 'rm-chain-desc', stepWhat));
      }

      if (hasEvidence) {
        var filesDiv = el('div', 'rm-chain-files');
        filesDiv.appendChild(txt('span', 'rm-chain-files-label', LABELS.evidenceFiles + ': '));
        s.evidence_files.forEach(function (ef) {
          var fileRow = el('div', 'rm-chain-file-row');
          var pathSpan = txt('span', 'rm-chain-file', ef);
          fileRow.appendChild(pathSpan);
          var eReason = reasonIndex[ef];
          if (eReason) {
            var reasonSpan = txt('span', 'rm-chain-file-reason', eReason);
            fileRow.appendChild(reasonSpan);
          }
          filesDiv.appendChild(fileRow);
        });
        body.appendChild(filesDiv);
      }

      step.appendChild(body);
      container.appendChild(step);
    });

    section.appendChild(container);
    return section;
  }

  function renderReadOrder(files, maxShow) {
    if (!files || !files.length) return null;

    var section = el('div');
    section.appendChild(txt('div', 'rm-section-title', LABELS.filesToRead + ' (' + files.length + ')'));

    var limit = maxShow || files.length;
    var visible = files.slice(0, limit);
    var hidden = files.slice(limit);

    var ol = el('div', 'rm-read-order');
    visible.forEach(function (fi, i) {
      ol.appendChild(renderReadOrderItem(fi, i + 1, fi.priority));
    });
    section.appendChild(ol);

    if (hidden.length > 0) {
      var expandDiv = el('div', 'rm-read-order-expand');
      var btn = el('button', 'rm-expand-btn');
      btn.textContent = LABELS.showMore.replace('{count}', hidden.length);
      var expanded = false;
      btn.onclick = function () {
        if (expanded) {
          while (ol.children.length > limit) ol.removeChild(ol.lastChild);
          btn.textContent = LABELS.showMore.replace('{count}', hidden.length);
        } else {
          hidden.forEach(function (fi, j) {
            ol.appendChild(renderReadOrderItem(fi, limit + j + 1, fi.priority));
          });
          btn.textContent = LABELS.showLess;
        }
        expanded = !expanded;
      };
      expandDiv.appendChild(btn);
      section.appendChild(expandDiv);
    }

    return section;
  }

  function renderReadOrderItem(fi, num, priority) {
    var item = el('div', 'rm-read-order-item');

    var numEl = el('div', 'rm-read-order-num');
    if (priority >= 3) numEl.classList.add('rm-read-order-num--p3');
    else if (priority >= 2) numEl.classList.add('rm-read-order-num--p2');
    numEl.textContent = num;
    item.appendChild(numEl);

    var body = el('div', 'rm-read-order-body');
    var pathRow = el('div', 'rm-read-order-path-row');
    pathRow.appendChild(txt('span', 'rm-read-order-path', fi.path));
    if (fi.kind) pathRow.appendChild(renderKindBadge(fi.kind));
    body.appendChild(pathRow);
    if (fi.reason) {
      body.appendChild(txt('div', 'rm-read-order-reason', fi.reason));
    }
    item.appendChild(body);

    return item;
  }

  function renderFileList(title, files) {
    if (!files || !files.length) return null;

    var section = el('div');
    section.appendChild(txt('div', 'rm-section-title', title + ' (' + files.length + ')'));

    var ul = el('ul', 'rm-file-list');
    files.forEach(function (f) {
      var li = el('li', 'rm-file-list-item');
      var pathSpan = txt('span', 'rm-file-path', f.path);
      li.appendChild(pathSpan);
      if (f.reason) {
        li.appendChild(txt('span', 'rm-file-reason', f.reason));
      }
      ul.appendChild(li);
    });
    section.appendChild(ul);
    return section;
  }

  function renderExpandableList(title, items, boxClass, maxShow) {
    if (!items || !items.length) return null;
    var limit = maxShow || 3;
    var visible = items.slice(0, limit);
    var hidden = items.slice(limit);

    var box = el('div', boxClass);
    var titleEl = el('strong');
    titleEl.textContent = title + ': ';
    box.appendChild(titleEl);

    visible.forEach(function (u, i) {
      var p = el('div');
      p.className = 'rm-exp-item';
      p.textContent = '• ' + u;
      box.appendChild(p);
    });

    if (hidden.length > 0) {
      var hiddenDiv = el('div', 'rm-exp-hidden');
      hidden.forEach(function (u) {
        var p = el('div');
        p.className = 'rm-exp-item';
        p.textContent = '• ' + u;
        hiddenDiv.appendChild(p);
      });
      box.appendChild(hiddenDiv);

      var btn = el('button', 'rm-expand-btn-inline');
      btn.textContent = LABELS.showMore.replace('{count}', hidden.length);
      btn.onclick = function () {
        var showing = hiddenDiv.style.display === 'block';
        hiddenDiv.style.display = showing ? 'none' : 'block';
        btn.textContent = showing ? LABELS.showMore.replace('{count}', hidden.length) : LABELS.showLess;
      };
      box.appendChild(btn);
    }

    return box;
  }

  function renderUnknowns(unknowns) {
    return renderExpandableList(LABELS.knownUnknowns, unknowns, 'rm-info-box', 3);
  }

  function renderWarnings(warnings) {
    return renderExpandableList(LABELS.warnings, warnings, 'rm-warn-box', 3);
  }

  function renderBundleStats(stats) {
    var container = el('div', 'rm-collapsible');

    var toggle = el('button', 'rm-collapsible-toggle');
    toggle.textContent = LABELS.retrievalDetails;
    toggle.onclick = function () {
      container.classList.toggle('rm-collapsible--open');
    };
    container.appendChild(toggle);

    var body = el('div', 'rm-collapsible-body');
    var list = [
      'Source files selected: ' + stats.selected_files_count,
      'Test files selected:   ' + stats.selected_tests_count,
      'Docs selected:         ' + stats.selected_docs_count,
      'Packages selected:     ' + stats.selected_packages_count,
      'Related import edges:  ' + stats.related_edges_count,
    ];
    list.forEach(function (line) {
      var div = txt('div', 'rm-bundle-stat', line);
      body.appendChild(div);
    });
    container.appendChild(body);
    return container;
  }

  function renderStringList(title, items) {
    if (!items || !items.length) return null;

    var section = el('div');
    section.appendChild(txt('div', 'rm-section-title', title + ' (' + items.length + ')'));

    var ul = el('ul', 'rm-file-list');
    items.forEach(function (s) {
      var li = el('li');
      li.textContent = s;
      ul.appendChild(li);
    });
    section.appendChild(ul);
    return section;
  }

  function renderEdgeList(title, edges) {
    if (!edges || !edges.length) return null;

    var section = el('div');
    section.appendChild(txt('div', 'rm-section-title', title + ' (' + edges.length + ')'));

    var ul = el('ul', 'rm-file-list');
    edges.forEach(function (e) {
      var li = el('li');
      li.textContent = e.from + ' → ' + e.to;
      ul.appendChild(li);
    });
    section.appendChild(ul);
    return section;
  }

  function renderErrorBox(error) {
    var box = el('div', 'rm-error-box');
    box.textContent = error;
    return box;
  }

  function renderCollapsedError(error) {
    var container = el('div', 'rm-collapsible');

    var toggle = el('button', 'rm-collapsible-toggle');
    toggle.textContent = 'Show parse error';
    toggle.onclick = function () {
      container.classList.toggle('rm-collapsible--open');
    };
    container.appendChild(toggle);

    var body = el('div', 'rm-collapsible-body');
    body.appendChild(renderErrorBox(error));
    container.appendChild(body);
    return container;
  }

  function renderUnverifiedPaths(paths) {
    if (!paths || !paths.length) return null;

    var section = el('div');
    section.appendChild(txt('div', 'rm-section-title', LABELS.unverified));
    var tags = el('div', 'rm-tags');
    paths.forEach(function (up) {
      var tag = el('span', 'rm-tag');
      tag.textContent = up.path;
      if (up.reason) tag.title = up.reason;
      tags.appendChild(tag);
    });
    section.appendChild(tags);
    return section;
  }

  function renderFlowPage(flow) {
    var page = el('div');

    var header = el('div', 'rm-flow-header');
    header.appendChild(txt('h2', '', flow.name || flow.id));
    if (!flow.error) {
      header.appendChild(renderEvidenceBadge(flow.confidence));
    }
    page.appendChild(header);

    if (flow.error) {
      page.appendChild(txt('div', 'rm-fallback-heading', 'Flow explanation failed, but local context was collected'));

      var filesSection = renderFileList('Files selected by deterministic retrieval', flow.bundle_files);
      if (filesSection) page.appendChild(filesSection);

      var testsSection = renderFileList('Tests selected by deterministic retrieval', flow.bundle_tests);
      if (testsSection) page.appendChild(testsSection);

      var docsSection = renderFileList('Docs selected', flow.bundle_docs);
      if (docsSection) page.appendChild(docsSection);

      var pkgsSection = renderStringList('Packages selected', flow.bundle_packages);
      if (pkgsSection) page.appendChild(pkgsSection);

      var edgesSection = renderEdgeList('Related import edges', flow.bundle_edges);
      if (edgesSection) page.appendChild(edgesSection);

      if (flow.bundle_summary) {
        page.appendChild(renderBundleStats(flow.bundle_summary));
      }

      page.appendChild(renderCollapsedError(flow.error));
      return page;
    }

    if (flow.summary) {
      page.appendChild(txt('div', 'rm-summary', flow.summary));
    }

    if (flow.files_to_read_in_order && flow.files_to_read_in_order.length > 0) {
      page.appendChild(renderReadOrder(flow.files_to_read_in_order, 5));
    }

    if (flow.likely_chain && flow.likely_chain.length > 0) {
      var chainSection = renderChainSteps(flow.likely_chain, flow.files_to_read_in_order);
      if (chainSection.children.length > 1) {
        page.appendChild(chainSection);
      }
    }

    var testsSection = renderFileList(LABELS.testsToRead, flow.tests_to_read);
    if (testsSection) page.appendChild(testsSection);

    var unknownsSection = renderUnknowns(flow.unknowns);
    if (unknownsSection) page.appendChild(unknownsSection);

    var warningsSection = renderWarnings(flow.warnings);
    if (warningsSection) page.appendChild(warningsSection);

    var uvSection = renderUnverifiedPaths(flow.unverified_paths);
    if (uvSection) page.appendChild(uvSection);

    if (flow.bundle_summary) {
      page.appendChild(renderBundleStats(flow.bundle_summary));
    }

    return page;
  }

  function renderPlaceholder(text) {
    return txt('div', 'rm-placeholder', text);
  }

  // ── Tab management ──────────────────────────────────────────────

  function showTab(id) {
    document.querySelectorAll('.rm-tab, .rm-tab-content').forEach(function (e) {
      e.classList.remove('rm-active');
    });
    var content = document.getElementById(id);
    if (content) content.classList.add('rm-active');
    var tab = document.querySelector('.rm-tab[data-tab="' + id + '"]');
    if (tab) tab.classList.add('rm-active');
  }

  // ── Main render ─────────────────────────────────────────────────

  function render() {
    document.getElementById('rm-repo-name').textContent = DATA.repo_name || 'unknown';
    document.getElementById('rm-project-guess').textContent = DATA.project_guess || '';
    if (DATA.artifacts_dir) {
      document.getElementById('rm-artifacts-dir').textContent = 'Artifacts: ' + DATA.artifacts_dir;
    }

    var tabs = document.getElementById('rm-tabs');
    var overviewTab = el('button', 'rm-tab rm-active');
    overviewTab.textContent = 'Overview';
    overviewTab.setAttribute('data-tab', 'rm-overview');
    overviewTab.onclick = function () { showTab('rm-overview'); };
    tabs.appendChild(overviewTab);

    DATA.flows.forEach(function (f) {
      var tab = el('button', 'rm-tab');
      if (f.error) {
        tab.classList.add('rm-tab--error');
        tab.textContent = f.name || f.id;
      } else {
        var parts = [f.name || f.id];
        if (f.warnings && f.warnings.length > 0) {
          tab.classList.add('rm-tab--warn');
          parts.push(f.warnings.length + ' warning' + (f.warnings.length > 1 ? 's' : ''));
        }
        if (f.unverified_paths && f.unverified_paths.length > 0) {
          tab.classList.add('rm-tab--partial');
          parts.push('partial');
        }
        tab.textContent = parts.join(' · ');
      }
      tab.setAttribute('data-tab', 'rm-flow-' + f.id);
      tab.onclick = function () { showTab('rm-flow-' + f.id); };
      tabs.appendChild(tab);
    });

    var overview = document.getElementById('rm-overview');
    var overviewHTML = el('div');

    if (!DATA.flows || DATA.flows.length === 0) {
      overviewHTML.appendChild(txt('div', 'rm-card', LABELS.noFlows));
    } else {
      var card = el('div', 'rm-card');
      card.appendChild(txt('h2', '', LABELS.candidateFlows));
      var grid = el('div', 'rm-overview-flows');

      DATA.flows.forEach(function (f) {
        var isRecommended = DATA.recommended_flow && f.id === DATA.recommended_flow;
        grid.appendChild(renderFlowCard(f, isRecommended));
      });

      card.appendChild(grid);
      overviewHTML.appendChild(card);

      if (DATA.flows.length > 0) {
        var qs = el('div', 'rm-quick-start');
        qs.appendChild(txt('div', 'rm-section-title', LABELS.quickStart));
        DATA.flows.forEach(function (f) {
          if (f.files_to_read_in_order && f.files_to_read_in_order.length > 0) {
            var item = el('div', 'rm-quick-start-item');
            var flowLink = el('span', 'rm-quick-start-flow');
            flowLink.textContent = f.name || f.id;
            flowLink.onclick = function () { showTab('rm-flow-' + f.id); };
            item.appendChild(flowLink);
            item.appendChild(txt('span', '', '→ ' + f.files_to_read_in_order[0].path));
            qs.appendChild(item);
          }
        });
        overviewHTML.appendChild(qs);
      }
    }

    if (DATA.warnings && DATA.warnings.length > 0) {
      overviewHTML.appendChild(renderWarnings(DATA.warnings));
    }

    overview.innerHTML = '';
    overview.appendChild(overviewHTML);

    var flowsContainer = document.getElementById('rm-flows-container');
    flowsContainer.innerHTML = '';
    DATA.flows.forEach(function (f) {
      var page = el('div', 'rm-tab-content');
      page.id = 'rm-flow-' + f.id;
      page.appendChild(renderFlowPage(f));
      flowsContainer.appendChild(page);
    });
  }

  window.addEventListener('DOMContentLoaded', render);
})();
</script>
</body>
</html>
