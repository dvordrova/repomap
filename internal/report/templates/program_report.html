<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>repomap — {{.Title}}</title>
  <style id="rm-report-app-css">{{.ReportAppCSS}}</style>
</head>
<body>
  <a class="rm-skip-link" href="#rm-app">Skip to repository orientation</a>
  <noscript>
    <style>body > :not(noscript) { display: none !important; }</style>
    <p>This report requires JavaScript. Its repository evidence is embedded in this HTML file.</p>
  </noscript>
  <header class="rm-site-header">
    <a class="rm-brand" href="#/repository" aria-label="Repomap repository overview">
      <span class="rm-brand__mark" aria-hidden="true">r</span>
      <span>repomap</span>
    </a>
    <details class="rm-target-switcher" id="rm-target-switcher">
      <summary>
        <span class="rm-target-switcher__repository" id="rm-target-repository"></span>
        <span class="rm-target-switcher__current" id="rm-target-current"></span>
        <span class="rm-target-switcher__count" id="rm-target-count"></span>
      </summary>
      <div class="rm-target-switcher__panel">
        <div class="rm-target-switcher__heading">
          <strong>Repository targets</strong>
          <span id="rm-target-panel-count"></span>
        </div>
        <nav class="rm-target-switcher__targets" id="rm-target-navigation" aria-label="Repository targets"></nav>
      </div>
    </details>
    <div class="rm-site-header__scope" id="rm-page-context"></div>
  </header>
  <main id="rm-app" aria-live="polite">
    <p class="rm-loading">Building the repository orientation…</p>
  </main>
  <section class="rm-fatal" id="rm-fatal" role="alert" hidden>
    <p class="rm-eyebrow">Report unavailable</p>
    <h1>The repository orientation could not be opened</h1>
    <p id="rm-fatal-message"></p>
  </section>
  <div class="rm-toast" id="rm-toast" role="status" aria-live="polite" hidden></div>
{{.BrowserTransport}}
  <script id="rm-report-loader-js">{{.ReportLoaderJS}}</script>
  <script id="rm-system-canvas-graph-js">{{.SystemCanvasGraphJS}}</script>
  <script id="rm-system-canvas-interaction-js">{{.SystemCanvasInteractionJS}}</script>
  <script id="rm-system-canvas-geometry-js">{{.SystemCanvasGeometryJS}}</script>
  <script id="rm-system-canvas-renderer-js">{{.SystemCanvasRendererJS}}</script>
  <script id="rm-report-app-js">{{.ReportAppJS}}</script>
  <script id="rm-report-app-boot-js">
    try {
      RepomapReportApp.boot(RepomapReportLoader.create(document,window.location));
    } catch (error) {
      RepomapReportApp.fail(error);
    }
  </script>
</body>
</html>
