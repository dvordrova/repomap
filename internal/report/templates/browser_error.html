<!DOCTYPE html>
<html lang="{{.Language}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>repomap</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f7f9fc; color: #172033; }
    main { box-sizing: border-box; display: grid; min-height: 100vh; place-items: center; padding: 2rem; }
    section { max-width: 42rem; border: 1px solid #d9e1ef; border-radius: 1rem; background: #fff; padding: 2rem; box-shadow: 0 1rem 3rem rgba(23, 32, 51, .08); }
    p { margin: 0; font-size: 1.125rem; line-height: 1.55; }
  </style>
</head>
<body>
  <main>
    <section role="alert" aria-live="assertive">
      <p data-rm-message="{{.MessageID}}"></p>
    </section>
  </main>
  <script>{{.UIMessagesJS}}</script>
  <script>
    (function () {
      'use strict';
      var node = document.querySelector('[data-rm-message]');
      node.textContent = window.RepomapUI.message(node.getAttribute('data-rm-message'));
    })();
  </script>
</body>
</html>
