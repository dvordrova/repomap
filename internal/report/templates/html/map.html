{{define "map.html"}}<figure class="map" data-map>
<svg viewBox="0 0 {{printf "%.0f" .Width}} {{printf "%.0f" .Height}}" width="{{printf "%.0f" .Width}}" height="{{printf "%.0f" .Height}}" role="img" aria-label="Map of this target's groups and the connections between them" class="map-svg" style="min-width:{{printf "%.0f" .MinWidth}}px">
<defs><marker id="map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0.5 L10 5 L0 9.5 z" class="map-arrow-head"/></marker></defs>
<g class="map-frames">{{range .Frames}}<g class="map-frame map-frame-{{.Lane}}"><rect x="{{printf "%.1f" .X}}" y="{{printf "%.1f" .Y}}" width="{{printf "%.1f" .Width}}" height="{{printf "%.1f" .Height}}" rx="10"/><text x="{{printf "%.1f" .LabelX}}" y="{{printf "%.1f" .LabelY}}">{{.Title}}</text></g>{{end}}</g>
<g class="map-lanes">{{range .Lanes}}<text x="{{printf "%.1f" .X}}" y="18" class="map-lane-label">{{.Label}}</text>{{end}}</g>
<g class="map-edges">{{range .Edges}}<path d="{{.Path}}" class="map-edge{{if .Possible}} map-edge-possible{{end}}" data-from="{{.From}}" data-to="{{.To}}" marker-end="url(#map-arrow)"><title>{{.Label}}</title></path>{{end}}</g>
<g class="map-edge-labels">{{range .Edges}}{{if .Lines}}<g class="map-edge-label" data-from="{{.From}}" data-to="{{.To}}">{{$edge := .}}{{range $line, $text := .Lines}}<text x="{{printf "%.1f" $edge.LabelX}}" y="{{printf "%.1f" $edge.LabelY}}" dy="{{if eq (len $edge.Lines) 1}}3.5{{else if eq $line 0}}-2{{else}}9{{end}}" text-anchor="middle">{{$text}}</text>{{end}}<title>{{.Label}}</title></g>{{end}}{{end}}</g>
<g class="map-nodes">{{range .Nodes}}<a href="{{.Href}}" class="map-node map-node-{{.Lane}}" data-node="{{.ID}}" data-near="{{.Neighbours}}" aria-label="{{.FullTitle}}, {{.Members}} symbol{{if ne .Members 1}}s{{end}}, {{.Degree}} connection{{if ne .Degree 1}}s{{end}} here{{if .Outside}}, {{.Outside}} to another target{{end}}">
<rect x="{{printf "%.1f" .X}}" y="{{printf "%.1f" .Y}}" width="{{printf "%.1f" .Width}}" height="{{printf "%.1f" .Height}}" rx="6" class="map-node-body"/>
{{$node := .}}{{range $line, $text := .Title}}<text x="{{printf "%.1f" $node.X}}" y="{{printf "%.1f" $node.Y}}" dx="11" dy="{{if eq $line 0}}17{{else}}30{{end}}" class="map-node-title">{{$text}}</text>{{end}}
<text x="{{printf "%.1f" .X}}" y="{{printf "%.1f" .Y}}" dx="11" dy="45" class="map-node-count">{{.Members}}{{if .Outside}} · {{.Outside}} outside{{end}}</text>
<rect x="{{printf "%.1f" .X}}" y="{{printf "%.1f" .Y}}" transform="translate(11 50)" width="{{printf "%.1f" .BarWidth}}" height="3" rx="1.5" class="map-node-bar"/>
{{if .Steps}}<text x="{{printf "%.1f" .StepX}}" y="{{printf "%.1f" .StepY}}" text-anchor="end" class="map-node-step">step {{.Steps}}</text>{{end}}
<title>{{.FullTitle}} — {{.Summary}}</title>
</a>{{end}}</g>
</svg>
<figcaption class="map-note">Groups of this target, left to right: what reaches in, what it is, what it reaches out to. The bar is how many symbols a group holds, and a step number marks a group the main flow passes through. An arrow runs from the group that reaches to the group it reaches, labelled with what the connection is where there is room and named in full when you point at it; a loop back into one column is a connection inside that column, a line along the bottom is one that skips a column, and a dashed arrow is one no exact call was found for. A named frame around several boxes is one part of this target and the boxes are the groups inside it. Click a group to open it below.{{if ge .LargestPct 25}} The largest holds {{.LargestPct}}% of the target on its own.{{end}}{{if .Subjects}} These groups name {{.Grouped}} of this target's {{.Subjects}} symbols and connections; the rest belong to no group and are not on this map.{{end}}</figcaption>
</figure>{{end}}
