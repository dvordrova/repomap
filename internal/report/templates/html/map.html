{{define "map.html"}}<figure class="map{{if .System}} system-canvas{{end}}" data-map data-trace="{{.Trace}}"{{if .Explorer}} data-map-explorer{{end}}{{if .System}} data-system-map{{end}}{{if .Operations}} data-operation-map{{end}}>
{{range .Nodes}}{{$node := .}}{{range .Aliases}}<span id="{{.}}" data-map-alias="{{$node.ID}}" hidden></span>{{end}}{{end}}
{{if .Operations}}<div class="operation-controls" data-operation-controls hidden>
<label>{{t "Find an operation"}} <input type="search" data-operation-search placeholder="{{t "Name or description"}}"></label>
<label>{{t "In"}} <select data-operation-group><option value="">{{t "All groups"}}</option></select></label>
<button type="button" data-operation-prev aria-label="{{t "Previous operations"}}">←</button><span data-operation-count aria-live="polite"></span><button type="button" data-operation-next aria-label="{{t "Next operations"}}">→</button>
<span class="operation-context" data-operation-context>{{t "Hover an operation to see the parts it touches."}}</span>
</div>{{end}}
{{template "map-controls.html"}}
<div class="map-stage" data-map-stage>
<svg viewBox="0 0 {{printf "%.0f" .Width}} {{printf "%.0f" .Height}}" width="{{printf "%.0f" .Width}}" height="{{printf "%.0f" .Height}}" role="group" aria-label="{{t "System architecture and connections"}}" class="map-svg" style="min-width:{{printf "%.0f" .MinWidth}}px">
<g class="map-edges">{{range $edge := .Edges}}<path class="map-edge{{if .Possible}} map-edge-possible{{end}}{{if .Init}} map-edge-init{{end}}" data-scope="{{.Scope}}"{{with pagedata "calls" .CallsJSON}} data-calls="{{.}}"{{with $edge.Relation}} data-label="{{.}}"{{end}}{{else}} data-label-ref="{{.LabelRef}}" data-label="{{.Label}}" data-summary="{{.Summary}}" data-summary-ref="{{.SummaryRef}}" data-from-source="{{.FromSource.Href}}" data-from-text="{{.FromSource.Text}}" data-from-no-source="{{.FromSource.NoSource}}" data-to-source="{{.ToSource.Href}}" data-to-text="{{.ToSource.Text}}" data-to-no-source="{{.ToSource.NoSource}}"{{end}} data-from="{{.From}}" data-to="{{.To}}" data-operations="{{.Operations}}"></path>{{end}}</g>
<g class="map-nodes">{{range .Nodes}}<a{{if .Href}} href="{{.Href}}"{{end}} id="{{.ID}}" class="map-node map-node-{{.Lane}}"{{if .InitiallyHidden}} style="display:none"{{end}}{{if .Activation}} target="_blank"{{end}} data-node="{{.ID}}" data-owner="{{.Owner}}" data-item-kind="{{.ItemKind}}" data-lane="{{.Lane}}" data-details-id="{{.DetailsID}}" data-near="{{.Neighbours}}" data-title="{{.FullTitle}}" data-members="{{.Members}}" data-summary="{{.Summary}}" data-subtitle="{{.Subtitle}}" data-summary-ref="{{.SummaryRef}}" data-keys="{{.Keys}}" {{with pagedata "symbols" .Symbols}}data-symbols="{{.}}" {{end}}{{with pagedata "symbolCalls" .SymbolCalls}}data-symbol-calls="{{.}}" {{end}}{{with pagedata "concepts" .Concepts}}data-concepts="{{.}}"{{end}}{{with pagedata "explained" .Explained}} data-explained="{{.}}"{{end}}{{with pagedata "dispatch" .Dispatch}} data-dispatch="{{.}}"{{end}}{{with pagedata "reached" .Reached}} data-reached="{{.}}"{{end}}{{if .Trace}} data-input-trace="{{.Trace}}"{{end}}{{with pagedata "inputPath" .InputPath}} data-input-path="{{.}}"{{end}}{{with .Written}} data-written="{{.}}"{{end}}{{with .Spellings}} data-spellings="{{.}}"{{end}}{{with pagedata "sets" .Sets}} data-sets="{{.}}"{{end}}{{if .Handler}} data-handler="{{.Handler}}" data-handler-source="{{.HandlerSource.Href}}" data-handler-open="{{.HandlerSource.Open}}" data-handler-no-source="{{.HandlerSource.NoSource}}"{{end}}{{if .HandlerUnknown}} data-handler-unknown="true"{{end}}{{if .Catalogue}} data-catalogue="{{pagedata "catalogue" .Catalogue}}" data-declared-by="{{.DeclaredBy}}"{{end}}{{if .Declares}} data-declares="{{.Declares}}"{{end}}{{with pagedata "launch" .Launch}} data-launch="{{.}}"{{end}}{{with pagedata "collection" .Collection}} data-collection="{{.}}"{{end}}{{with pagedata "entries" .Entries}} data-entries="{{.}}"{{end}}{{with pagedata "files" .Files}} data-files="{{.}}"{{end}}{{with pagedata "sources" .Sources}} data-sources="{{.}}"{{end}}{{with pagedata "writes" .WritesJSON}} data-writes="{{.}}"{{end}} data-source="{{.Source.Href}}" data-source-text="{{.Source.Text}}" data-no-source="{{.Source.NoSource}}" data-open="{{.Source.Open}}" data-activation="{{.Activation}}" data-input-owner="{{.InputOwner}}" data-operation-group="{{.OperationGroup}}" data-remote="{{.Remote}}" data-children="{{.Children}}" data-branch="{{.Branch}}" data-component="{{.Component}}" data-role="{{.Role}}" data-role-ref="{{.RoleRef}}" data-language="{{.Language}}" data-component-kind="{{.ComponentKind}}"{{with .DestinationKind}} data-destination-kind="{{.}}"{{end}} data-source-kind="{{.SourceKind}}"{{if .Unestablished}} data-unestablished="true"{{end}}{{if .Test}} data-test="true"{{end}} aria-label="{{.FullTitle}}, {{if .Activation}}{{t .Activation}}{{else if .Branch}}{{.Subtitle}}{{else}}{{t "{0} symbols" .Members}}{{end}}">
</a>{{end}}</g>
</svg>
</div>
</figure>{{end}}
{{define "map-controls.html"}}<div class="map-controls" data-map-controls hidden>
<button type="button" data-map-fit title="{{t "Fit the whole map; labels may be smaller"}}">{{t "fit"}}</button>
<button type="button" data-map-zoom="1.25">+</button>
<button type="button" data-map-zoom="0.8">−</button>
<span class="map-hint">{{t "Zoom to see inside"}} · {{t "Drag to move"}}</span>
</div>{{end}}
