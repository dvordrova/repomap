{{define "map.html"}}<figure class="map" data-map data-trace="{{.Trace}}"{{if .Explorer}} data-map-explorer{{end}}{{if .Operations}} data-operation-map{{end}}>
{{if .Operations}}<div class="operation-controls" data-operation-controls hidden>
<label>{{t "Find an operation"}} <input type="search" data-operation-search placeholder="{{t "Name or description"}}"></label>
<label>{{t "In"}} <select data-operation-group><option value="">{{t "All groups"}}</option></select></label>
<button type="button" data-operation-prev aria-label="{{t "Previous operations"}}">←</button><span data-operation-count aria-live="polite"></span><button type="button" data-operation-next aria-label="{{t "Next operations"}}">→</button>
<span class="operation-context" data-operation-context>{{t "Hover an operation to see the parts it touches."}}</span>
</div>{{end}}
{{template "map-controls.html"}}
<div class="map-stage" data-map-stage>
<svg viewBox="0 0 {{printf "%.0f" .Width}} {{printf "%.0f" .Height}}" width="{{printf "%.0f" .Width}}" height="{{printf "%.0f" .Height}}" role="img" aria-label="{{t "Map of this target's groups and the connections between them"}}" class="map-svg" style="min-width:{{printf "%.0f" .MinWidth}}px">
<defs><marker id="{{.MarkerID}}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0.5 L10 5 L0 9.5 z" class="map-arrow-head"/></marker></defs>
<g class="map-frames">{{range .Frames}}<g class="map-frame map-zone-{{.Zone}}" id="{{.ID}}" data-frame="{{.ID}}"><rect x="{{printf "%.1f" .X}}" y="{{printf "%.1f" .Y}}" width="{{printf "%.1f" .Width}}" height="{{printf "%.1f" .Height}}" rx="6"/><text x="{{printf "%.1f" .LabelX}}" y="{{printf "%.1f" .LabelY}}">{{.Title}}{{if gt .Holds .Shown}} · {{t "{0} groups" .Holds}}{{end}}</text></g>{{end}}</g>
<g class="map-lanes">{{range .Lanes}}<text x="{{printf "%.1f" .X}}" y="18" class="map-lane-label">{{.Label}}</text>{{end}}</g>
<g class="map-edges">{{range .Edges}}<path d="{{.Path}}" class="map-edge{{if .Possible}} map-edge-possible{{end}}" data-scope="{{.Scope}}" data-label-ref="{{.LabelRef}}" data-summary="{{.Summary}}" data-summary-ref="{{.SummaryRef}}" data-from-source="{{.FromSource.Href}}" data-from-text="{{.FromSource.Text}}" data-from-no-source="{{.FromSource.NoSource}}" data-to-source="{{.ToSource.Href}}" data-to-text="{{.ToSource.Text}}" data-to-no-source="{{.ToSource.NoSource}}"{{if and $.Explorer (ne .Scope "static")}} style="display:none"{{end}} data-from="{{.From}}" data-to="{{.To}}" data-operations="{{.Operations}}" marker-end="url(#{{$.MarkerID}})"><title>{{.Label}}</title></path>{{end}}</g>
<g class="map-edge-labels">{{range .Edges}}{{if .Lines}}<g class="map-edge-label" data-from="{{.From}}" data-to="{{.To}}">{{$edge := .}}{{range $line, $text := .Lines}}<text x="{{printf "%.1f" $edge.LabelX}}" y="{{printf "%.1f" $edge.LabelY}}" dy="{{if eq (len $edge.Lines) 1}}3.5{{else if eq $line 0}}-2{{else}}9{{end}}" text-anchor="middle">{{$text}}</text>{{end}}<title>{{.Label}}</title></g>{{end}}{{end}}</g>
<g class="map-nodes">{{range .Nodes}}<a{{if .Href}} href="{{.Href}}"{{end}} id="{{.ID}}" class="map-node map-node-{{.Lane}}"{{if .InitiallyHidden}} style="display:none"{{end}}{{if .Activation}} target="_blank" rel="noopener"{{end}} data-node="{{.ID}}" data-near="{{.Neighbours}}" data-title="{{.FullTitle}}" data-canonical-title="{{.CanonicalTitle}}" data-members="{{.Members}}" data-summary="{{.Summary}}" data-summary-ref="{{.SummaryRef}}" data-keys="{{.Keys}}" data-concepts="{{.Concepts}}" data-call-paths="{{.CallPaths}}" data-source="{{.Source.Href}}" data-source-text="{{.Source.Text}}" data-no-source="{{.Source.NoSource}}" data-open="{{.Source.Open}}" data-activation="{{.Activation}}" data-operation-group="{{.OperationGroup}}" data-remote="{{.Remote}}" data-children="{{.Children}}" data-branch="{{.Branch}}" data-component="{{.Component}}" data-source-kind="{{.SourceKind}}" aria-label="{{.FullTitle}}, {{if .Activation}}{{t .Activation}}{{else if .Branch}}{{.Subtitle}}{{else}}{{t "{0} symbols" .Members}}{{end}}">
<rect x="{{printf "%.1f" .X}}" y="{{printf "%.1f" .Y}}" width="{{printf "%.1f" .Width}}" height="{{printf "%.1f" .Height}}" rx="6" class="map-node-body"/>
{{$node := .}}{{range $line, $text := .Title}}<text x="{{printf "%.1f" $node.X}}" y="{{printf "%.1f" $node.Y}}" dx="11" dy="{{if eq $line 0}}20{{else}}37{{end}}" class="map-node-title">{{$text}}</text>{{end}}
{{if .Subtitle}}<text x="{{printf "%.1f" .X}}" y="{{printf "%.1f" .Y}}" dx="11" dy="56" class="map-node-context">{{.Subtitle}}</text>{{end}}
{{if .Steps}}<text x="{{printf "%.1f" .StepX}}" y="{{printf "%.1f" .StepY}}" text-anchor="end" class="map-node-step">{{.Steps}}</text>{{end}}
<title>{{.FullTitle}} — {{.Summary}}{{if .Source.NoSource}} — {{t "No source"}}{{end}}</title>
</a>{{end}}</g>
</svg>
</div>
<figcaption class="map-note"><span class="map-line">{{t "Open a part to see its key code. Click a code element to read its explanation below. Arrows connect parts, not the code elements inside them."}}{{if .Hidden}} {{t "{0} more groups are on the cards below." .Hidden}}{{end}}</span>
<details class="map-legend"><summary>{{t "legend"}}</summary><ul class="plain">
<li>{{t "Structure shows areas and parts. Click an area to open its parts, or a part to see its callers and dependencies. Back returns to the containing area or component."}}</li>
{{if .Operations}}<li>{{t "Operations follows one command, endpoint or activity. Its context stays selected while you explore; All uses returns to the complete structure."}}</li>{{end}}
<li>{{t "A connection may contain several relations between the folded areas. Click it to read the individual endpoints and evidence. These are static relations, not a recorded execution."}}</li>
{{if .Subjects}}<li>{{t "These groups name {0} of this target's {1} symbols and connections." .Grouped .Subjects}}</li>{{end}}
</ul></details></figcaption>
</figure>{{end}}
{{define "map-controls.html"}}<div class="map-controls" data-map-controls hidden>
<button type="button" data-map-fit title="{{t "Fit the whole map; labels may be smaller"}}">{{t "fit"}}</button>
<button type="button" data-map-zoom="1.25">+</button>
<button type="button" data-map-zoom="0.8">−</button>
<button type="button" data-map-reset title="{{t "Return to readable text"}}">{{t "reset"}}</button>
<span class="map-hint">{{t "drag to pan"}}</span>
</div>{{end}}
