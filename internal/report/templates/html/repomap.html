{{define "repomap.html"}}<figure class="map repo-map" data-map>
<svg viewBox="0 0 {{printf "%.0f" .Width}} {{printf "%.0f" .Height}}" width="{{printf "%.0f" .Width}}" height="{{printf "%.0f" .Height}}" role="img" aria-label="The targets of this repository and the HTTP calls between them" class="map-svg">
<defs><marker id="repo-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" class="map-arrow-head"/></marker></defs>
<g class="map-edges">{{range .Edges}}<path d="{{.Path}}" class="map-edge{{if .Possible}} map-edge-possible{{end}}" marker-end="url(#repo-arrow)"/><text x="{{printf "%.1f" .LabelX}}" y="{{printf "%.1f" .LabelY}}" text-anchor="middle" class="repo-edge-label">{{.Label}}</text>{{end}}</g>
<g class="map-nodes">{{range .Nodes}}<a href="{{.Href}}" class="map-node repo-node">
<rect x="{{printf "%.1f" .X}}" y="{{printf "%.1f" .Y}}" width="{{printf "%.1f" .Width}}" height="{{printf "%.1f" .Height}}" rx="7" class="map-node-body"/>
<text x="{{printf "%.1f" .X}}" y="{{printf "%.1f" .Y}}" dx="13" dy="26" class="repo-node-name">{{.Name}}</text>
<text x="{{printf "%.1f" .X}}" y="{{printf "%.1f" .Y}}" dx="13" dy="43" class="map-node-count">{{.Detail}}</text>
</a>{{end}}</g>
</svg>
</figure>{{end}}
