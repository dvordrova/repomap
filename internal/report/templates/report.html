<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>repomap — {{.Title}}</title>
  <style>{{.CSS}}</style>
{{if .HasArchitectureCanvas}}  <style id="rm-architecture-canvas-css">{{.ArchitectureCanvasCSS}}</style>
{{end}}
</head>
<body>
  <header>
    <h1 id="rm-repo-name"></h1>
    <div class="rm-artifacts" id="rm-artifacts-dir"></div>
    <div class="rm-artifacts" id="rm-feedback-path"></div>
  </header>
  <div class="rm-container">
    <nav class="rm-tabs" id="rm-tabs"></nav>
    <section id="rm-overview" class="rm-tab-content rm-active"></section>
    <div id="rm-flows-container"></div>
  </div>
  <noscript><p>This report requires JavaScript. The raw data is available in <code>report.json</code>.</p></noscript>
  <script type="application/json" id="rm-report-data">{{.DataJSON}}</script>
{{if .HasArchitectureCanvas}}  <script id="rm-elkjs">{{.ELKJS}}</script>
  <script id="rm-architecture-canvas-js">{{.ArchitectureCanvasJS}}</script>
{{end}}
  <script>{{.JS}}</script>
</body>
</html>
