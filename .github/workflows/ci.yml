name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    - run: go test ./...
    - run: go vet ./...
    - run: go build -trimpath -o /tmp/repomap ./cmd/repomap
    - run: /tmp/repomap . --offline --no-secrets --no-open --no-serve --debug-dir /tmp/repomap-runs
